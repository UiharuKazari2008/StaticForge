<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8743f"/><stop offset="1" stop-color="#6b3818"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ee"/><stop offset="1" stop-color="#d6ccb6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa8ff"/><stop offset="1" stop-color="#1f5ad0"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f969e"/><stop offset=".4" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa1a9"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36e"/><stop offset="1" stop-color="#f08a12"/>
    </linearGradient>
  </defs>
  <!-- satellite: bold and simple so it reads at 16 px -->
  <g transform="translate(128 62) rotate(-20)">
    <rect x="-96" y="-22" width="62" height="44" rx="4" fill="url(#panel)" stroke="#123a85" stroke-width="6"/>
    <rect x="34" y="-22" width="62" height="44" rx="4" fill="url(#panel)" stroke="#123a85" stroke-width="6"/>
    <path d="M-65 -22v44M65 -22v44" stroke="#bcd6ff" stroke-width="4"/>
    <rect x="-34" y="-4" width="68" height="8" fill="#5d646c"/>
    <rect x="-26" y="-24" width="52" height="48" rx="10" fill="url(#silver)" stroke="#3a4048" stroke-width="6"/>
    <path d="M-10 24 l-6 12 h32 l-6 -12 z" fill="#3a4048"/>
    <path d="M-24 40 q24 16 48 0 z" fill="#f3f5f7" stroke="#3a4048" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <!-- radio: wood case, cream face, round speaker, lit dial, one knob -->
  <rect x="20" y="118" width="216" height="120" rx="20" fill="url(#wood)" stroke="#3a1a08" stroke-width="7"/>
  <rect x="38" y="136" width="180" height="84" rx="10" fill="url(#face)" stroke="#5b3416" stroke-width="5"/>
  <circle cx="86" cy="178" r="32" fill="#3b2c1e" stroke="#1d140b" stroke-width="4"/>
  <circle cx="86" cy="178" r="18" fill="none" stroke="#b9925f" stroke-width="5"/>
  <rect x="130" y="148" width="76" height="30" rx="5" fill="url(#dial)" stroke="#6b3c08" stroke-width="4"/>
  <path d="M166 152v22" stroke="#c4210c" stroke-width="5" stroke-linecap="round"/>
  <circle cx="168" cy="200" r="13" fill="#dfe3e8" stroke="#3a4048" stroke-width="4"/>
  <path d="M40 124h176" stroke="#e6ad73" stroke-width="5" opacity=".6" stroke-linecap="round"/>
</svg>
