<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8683a"/><stop offset=".45" stop-color="#7b4521"/><stop offset="1" stop-color="#4b2611"/>
    </linearGradient>
    <linearGradient id="woodSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a2f15"/><stop offset=".5" stop-color="#8a4f28"/><stop offset="1" stop-color="#5a2f15"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe4"/><stop offset=".55" stop-color="#d9d0bd"/><stop offset="1" stop-color="#b9ae96"/>
    </linearGradient>
    <linearGradient id="grille" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a2a"/><stop offset="1" stop-color="#231a12"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d0c"/><stop offset="1" stop-color="#120c05"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".6">
      <stop offset="0" stop-color="#ffcf6a" stop-opacity=".85"/><stop offset="1" stop-color="#ff9a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="knob" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#c9ced4"/><stop offset="1" stop-color="#6e757d"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb2f5"/><stop offset=".5" stop-color="#2f6fd8"/><stop offset="1" stop-color="#1c4ea8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d949c"/><stop offset=".35" stop-color="#f4f6f8"/><stop offset=".7" stop-color="#c3c9d0"/><stop offset="1" stop-color="#7b828a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="faceClip"><rect x="44" y="140" width="168" height="70" rx="8"/></clipPath>
  </defs>
  <!-- floor shadow -->
  <ellipse cx="128" cy="238" rx="100" ry="9" fill="#000" opacity=".28" filter="url(#soft)"/>
  <!-- signal from the satellite down to the radio -->
  <g fill="none" stroke="#9cc8ff" stroke-linecap="round" opacity=".9">
    <path d="M150 92 q 14 10 18 24" stroke-width="5"/>
    <path d="M160 84 q 22 14 26 36" stroke-width="5" opacity=".7"/>
    <path d="M170 76 q 30 18 34 48" stroke-width="5" opacity=".45"/>
  </g>
  <!-- the satellite, solar panels out, as the GPS icon -->
  <g transform="translate(104 58) rotate(-28)">
    <g transform="translate(-74 -16)">
      <rect width="50" height="32" rx="2" fill="url(#panel)" stroke="#173f86" stroke-width="2"/>
      <path d="M12.5 0v32M25 0v32M37.5 0v32M0 16h50" stroke="#cfe2ff" stroke-width="1.2" opacity=".75"/>
      <rect width="50" height="14" rx="2" fill="#fff" opacity=".22"/>
    </g>
    <g transform="translate(24 -16)">
      <rect width="50" height="32" rx="2" fill="url(#panel)" stroke="#173f86" stroke-width="2"/>
      <path d="M12.5 0v32M25 0v32M37.5 0v32M0 16h50" stroke="#cfe2ff" stroke-width="1.2" opacity=".75"/>
      <rect width="50" height="14" rx="2" fill="#fff" opacity=".22"/>
    </g>
    <rect x="-27" y="-3" width="5" height="6" fill="#8a9099"/><rect x="22" y="-3" width="5" height="6" fill="#8a9099"/>
    <rect x="-22" y="-14" width="44" height="28" rx="6" fill="url(#body)" stroke="#5d646c" stroke-width="2"/>
    <rect x="-22" y="-14" width="44" height="10" rx="5" fill="#fff" opacity=".35"/>
    <path d="M-8 14 l-6 12 h28 l-6 -12 z" fill="#3a3f46"/>
    <ellipse cx="0" cy="28" rx="16" ry="5" fill="#d9dee4" stroke="#5d646c" stroke-width="1.5"/>
  </g>
  <!-- the radio: walnut case -->
  <rect x="26" y="120" width="204" height="108" rx="16" fill="url(#wood)" stroke="#3a1c0b" stroke-width="2.5"/>
  <path d="M34 128h188" stroke="#d29a63" stroke-width="2" opacity=".55"/>
  <g stroke="#3e1e0b" stroke-width="1.2" opacity=".35" fill="none">
    <path d="M30 136c40 -6 80 6 196 -2"/><path d="M30 222c60 4 120 -6 196 0"/><path d="M30 216c50 2 110 -4 196 2"/>
  </g>
  <!-- the face -->
  <rect x="42" y="138" width="172" height="74" rx="9" fill="url(#face)" stroke="#5b3a1d" stroke-width="2"/>
  <g clip-path="url(#faceClip)">
    <!-- speaker grille -->
    <rect x="50" y="146" width="80" height="58" rx="6" fill="url(#grille)"/>
    <g stroke="#b89466" stroke-width="2.4" opacity=".75">
      <path d="M56 154h68M56 162h68M56 170h68M56 178h68M56 186h68M56 194h68"/>
    </g>
    <!-- the dial window, lit -->
    <rect x="138" y="146" width="68" height="30" rx="4" fill="url(#glass)" stroke="#2b1c0c" stroke-width="1.5"/>
    <rect x="138" y="146" width="68" height="30" rx="4" fill="url(#glow)"/>
    <g stroke="#ffe7b0" stroke-width="1.4"><path d="M144 166v6M152 168v4M160 166v6M168 168v4M176 166v6M184 168v4M192 166v6M200 168v4"/></g>
    <path d="M170 150v22" stroke="#ff3b1f" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="138" y="146" width="68" height="10" rx="4" fill="#fff" opacity=".18"/>
    <!-- knobs -->
    <circle cx="156" cy="192" r="11" fill="url(#knob)" stroke="#4d535b" stroke-width="1.5"/>
    <circle cx="188" cy="192" r="11" fill="url(#knob)" stroke="#4d535b" stroke-width="1.5"/>
    <path d="M156 183v7M188 183v7" stroke="#3d434b" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- feet and top gloss -->
  <rect x="44" y="226" width="26" height="6" rx="2" fill="#2d1608"/><rect x="186" y="226" width="26" height="6" rx="2" fill="#2d1608"/>
  <rect x="30" y="122" width="196" height="22" rx="12" fill="url(#gloss)" opacity=".55"/>
</svg>
