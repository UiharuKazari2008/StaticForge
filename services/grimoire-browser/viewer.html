<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    overflow: hidden;
  }
  /* sized by the page; its backing store is the frame, which is the canvas's device pixels (#990: 1:1) */
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: default;
    touch-action: none;
  }
  /* the full-resolution still (zoomed or phone sessions): drawn over the frame until the next one */
  #still {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  #still[hidden] { display: none; }
  /* the page's fixed layers as sheets of their own (server.js layerSheets.js): over the frame and the still, still
     while the page scrolls under them; redrawn only when a sheet changes */
  #sheets {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  #sheets[hidden] { display: none; }
  /* Alchemy Information's checks (grimoire-browser-debug): layer borders and what each part of the picture came from */
  #debug {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  #debug[hidden] { display: none; }
  #tabStatus {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 24px;
    text-align: center;
    background: #1a1d24;
    color: #e8eaed;
    font: 16px/1.4 sans-serif;
  }
  #tabStatus[hidden] { display: none; }
  #tabStatus p { margin: 0; max-width: 36rem; }
  #tabStatusUrl { color: #9aa0a6; font-size: 13px; word-break: break-all; }
  #tabStatus button {
    margin-top: 8px;
    padding: 6px 12px;
    border: 1px solid #5f6368;
    border-radius: 4px;
    background: #2a2f38;
    color: inherit;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<canvas id="still" hidden></canvas>
<canvas id="sheets" hidden></canvas>
<canvas id="debug" hidden></canvas>
<div id="tabStatus" hidden>
  <p id="tabStatusTitle"></p>
  <p id="tabStatusUrl"></p>
  <p id="tabStatusDetail"></p>
  <button type="button" id="tabStatusReload">Reload</button>
</div>
<script>
(function () {
  var canvas = document.getElementById('view');
  var ctx = canvas.getContext('2d', { alpha: false });
  var meta = { deviceWidth: 1280, deviceHeight: 800 };
  var params = new URLSearchParams(location.search);
  var token = params.get('t') || '';
  var parts = location.pathname.split('/');
  var sessionId = parts[parts.length - 1] || '';
  var relay = location.pathname.indexOf('/api/grimoire-browser/view/') !== -1;
  var socket = null;
  // #990: the viewer's own WebSocket (straight to Alchemy, or through Dreamscape's relay socket). Only when that
  // cannot open does it fall back to the NDJSON stream with one POST per input event.
  var fallback = false;
  var pendingClipboard = null;
  var pendingMenu = null;
  var inputUrl = relay
    ? '/api/grimoire-browser/sessions/' + encodeURIComponent(sessionId) + '/input?t=' + encodeURIComponent(token)
    : '';
  var outbound = [];
  var sending = false;
  var pendingMove = null;
  var moveTimer = 0;

  function isGesture(obj) {
    return obj && ((obj.type === 'mouse' && (obj.kind === 'down' || obj.kind === 'up' || obj.kind === 'click'))
      || (obj.type === 'touch' && obj.kind !== 'move'));
  }

  function dropQueuedMoves() {
    var kept = [];
    for (var i = 0; i < outbound.length; i++) {
      if (!(outbound[i].type === 'mouse' && outbound[i].kind === 'move')) kept.push(outbound[i]);
    }
    outbound = kept;
  }

  function pumpOutbound() {
    if (!fallback || sending || !outbound.length) return;
    sending = true;
    var obj = outbound.shift();
    fetch(inputUrl, {
      method: 'POST',
      credentials: 'same-origin',
      priority: isGesture(obj) ? 'high' : 'auto',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(obj)
    }).then(function (res) {
      if (!res.ok) throw new Error('input');
    }).catch(function () {
      if (isGesture(obj) && (obj.tries || 0) < 2) {
        obj.tries = (obj.tries || 0) + 1;
        outbound.unshift(obj);
      }
    }).then(function () {
      sending = false;
      pumpOutbound();
    });
  }

  function enqueueInput(obj) {
    if (!fallback) {
      if (socket && socket.readyState === 1) socket.send(JSON.stringify(obj));
      return;
    }
    if (obj.type === 'mouse' && obj.kind === 'move') {
      for (var i = outbound.length - 1; i >= 0; i--) {
        if (outbound[i].type === 'mouse' && outbound[i].kind === 'move') {
          outbound[i] = obj;
          pumpOutbound();
          return;
        }
      }
    }
    if (obj.type === 'touch' && obj.kind === 'move') {
      var last = outbound[outbound.length - 1];
      if (last && last.type === 'touch' && last.kind === 'move') {
        outbound[outbound.length - 1] = obj;
        pumpOutbound();
        return;
      }
    }
    if (obj.type === 'wheel' || obj.type === 'scroll-to') {
      var tail = outbound[outbound.length - 1];
      if (tail && tail.type === obj.type && !!tail.ctrl === !!obj.ctrl) {
        if (obj.type === 'wheel') {
          tail.deltaX += obj.deltaX;
          tail.deltaY += obj.deltaY;
        }
        tail.x = obj.x;
        tail.y = obj.y;
        pumpOutbound();
        return;
      }
    }
    if (isGesture(obj) || obj.type === 'key' || obj.type === 'wheel') dropQueuedMoves();
    outbound.push(obj);
    pumpOutbound();
  }

  function sendMove(obj) {
    pendingMove = obj;
    if (moveTimer) return;
    moveTimer = setTimeout(function () {
      moveTimer = 0;
      var move = pendingMove;
      pendingMove = null;
      if (move) enqueueInput(move);
    }, fallback ? 30 : 16);
  }

  function send(obj) {
    if (obj.type === 'mouse' && obj.kind === 'move') {
      sendMove(obj);
      return;
    }
    if (isGesture(obj) || obj.type === 'key' || obj.type === 'wheel') {
      pendingMove = null;
      if (moveTimer) {
        clearTimeout(moveTimer);
        moveTimer = 0;
      }
    }
    enqueueInput(obj);
  }

  // ---- clock (#990) ----
  // Frames (t) and audio packets carry Alchemy's clock. The smallest (arrival - stamp) seen is the fastest a message
  // has ever come; how far a frame or a packet is behind that is its delay, the same measure for picture and sound.
  var clock = { off: Infinity, at: 0 };
  function noteClock(stamp) {
    var now = Date.now();
    var gap = now - stamp;
    if (!isFinite(gap)) return;
    // clocks drift a little: the floor creeps up 0.2 ms a second until a faster message sets it again
    if (clock.off !== Infinity) clock.off += (now - clock.at) * 0.0002;
    clock.at = now;
    if (gap < clock.off) clock.off = gap;
  }

  // ---- frames ----
  // The newest frame is kept on an offscreen canvas (base) at its own scroll offset; what shows (canvas) is drawn
  // from it, moved by the scrolling the viewer is doing ahead of the page (prediction below).
  var stillCanvas = document.getElementById('still');
  // sheets (kind 5 pictures, 'sheets' lists): id -> { gen, bmp }; sheetList in Chromium's drawing order, each placed
  // in the view in CSS pixels
  var sheetCanvas = document.getElementById('sheets');
  var sheetCtx = sheetCanvas.getContext('2d');
  var sheetImgs = new Map();
  var sheetList = [];
  var sheetDrawn = '';
  var sheetGen = 0;
  // Alchemy Information (grimoireIeChrome.js): borders of the layers, sheets, bars and cache blocks; the picture
  // coloured by where each part came from (baseSrc: what painted each part of base, newest last)
  var debugCanvas = document.getElementById('debug');
  var debugCtx = debugCanvas.getContext('2d');
  var debug = { on: false, borders: false, quality: false, content: false };
  // where the page draws text, images and flat fills (document CSS pixels; server.js layerSheets.js 'content')
  var contentMap = null;
  var baseSrc = [];
  var stillKey = '';
  // the frame, the still, the cache and the scratch keep a frame's transparency (see-through frames while the page's
  // layers under the content are sheets: Yozora's backdrop, Yukimi Nov 21); every write clears its area first, so a
  // transparent pixel replaces what was there instead of blending over it
  var stillCtx = stillCanvas.getContext('2d');
  var base = document.createElement('canvas');
  var baseCtx = base.getContext('2d');
  // vh: frame rows of the page's viewport; rows below it are the over-render band (Alchemy build, #993)
  var baseInfo = { sy: 0, sx: 0, k: 0, p: 0, t: 0, vh: 0 };
  // Arrival order of frames and stills: a frame hides the still only if it came after it.
  var arrivals = 0;
  var stillArrival = 0;
  var frameArrival = 0;
  // byte size of the frame the last still was taken over: the relay can deliver that frame after
  // the still, and it must not hide it
  var stillBase = 0;
  var queuedJob = null;
  var drawing = false;
  var paintGen = 0;
  var tileQueue = [];
  var tileChain = Promise.resolve();
  var textDecoder = new TextDecoder();

  // automatic quality (server.js noteViewerReport): binary bytes received since this socket opened, and how long a
  // whole frame takes to decode here (the device's frame rate ceiling)
  var rxTotal = 0;
  var decWin = { sum: 0, n: 0 };
  var lastReportFrames = 0;
  var encoder = null;

  function decodeImage(bytes, type) {
    if (bytes.length < 20000) return decodeImageNow(bytes, type);
    var t0 = performance.now();
    return decodeImageNow(bytes, type).then(function (img) {
      decWin.sum += performance.now() - t0;
      decWin.n += 1;
      return img;
    });
  }

  function decodeImageNow(bytes, type) {
    var blob = new Blob([bytes], { type: type || 'image/jpeg' });
    if (typeof createImageBitmap === 'function') return createImageBitmap(blob);
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(blob);
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
      img.src = url;
    });
  }

  // a frame's or still's format from its header (f): JPEG XL, WebP (see-through), else JPEG
  function frameType(f) {
    return f === 'jxl' ? 'image/jxl' : (f === 'webp' ? 'image/webp' : 'image/jpeg');
  }

  function releaseImage(img) {
    if (img && typeof img.close === 'function') img.close();
  }

  function hideStill() {
    if (!stillCanvas.hidden) stillCanvas.hidden = true;
  }

  function drawStill(msg) {
    stillCount += 1;
    var arrival = stillArrival = ++arrivals;
    stillBase = msg.baseBytes || 0;
    // one still on the way at a time (Alchemy waits for this before the next)
    send({ type: 'still-ack' });
    var bin = atob(msg.data);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    // the view at rest as JPEG XL from a lossless capture (server.js jxlRefine), else a JPEG still
    decodeImage(bytes, frameType(msg.f)).then(function (img) {
      // a newer frame or still came first, or the still is not of the page's current CSS size
      // (frames can be smaller than that: the phone's Desktop view gets 780 px frames of 1024)
      if (arrival !== stillArrival || frameArrival > arrival
        || Math.abs(msg.cssW - (meta.deviceWidth || 0)) > 1.5 || Math.abs(msg.cssH - (meta.deviceHeight || 0)) > 1.5) {
        releaseImage(img);
        return;
      }
      if (stillCanvas.width !== img.width || stillCanvas.height !== img.height) {
        stillCanvas.width = img.width;
        stillCanvas.height = img.height;
      }
      stillCtx.clearRect(0, 0, stillCanvas.width, stillCanvas.height);
      stillCtx.drawImage(img, 0, 0);
      stillKey = sourceKey(msg.f === 'jxl' ? 'stilljxl' : (msg.f === 'webp' ? 'stillwebp' : 'stilljpeg'), msg.q, msg.d);
      releaseImage(img);
      stillCanvas.hidden = false;
      cacheStill();
    }, function () {});
  }

  // A whole frame. header: t, sx, sy, k, p (server.js frameHeader); size: the message's length, for the still's base.
  function drawBytes(bytes, header, size) {
    var arrival;
    if (stillBase && size === stillBase && frameArrival < stillArrival) {
      // the still's own frame, delivered after it: older than the still
      arrival = stillArrival - 0.5;
    } else {
      arrival = ++arrivals;
    }
    stillBase = 0;
    frameArrival = arrival;
    if (header) noteClock(header.t);
    frameCount += 1;
    // a frame not drawn yet is replaced; the tiles that patched it go with it (the new frame has them)
    queuedJob = { bytes: bytes, header: header, arrival: arrival, tiles: [] };
    paintQueued();
  }

  function paintQueued() {
    if (drawing || !queuedJob) return;
    drawing = true;
    var job = queuedJob;
    queuedJob = null;
    tileQueue = job.tiles;
    var gen = ++paintGen;
    decodeImage(job.bytes, frameType(job.header && job.header.f)).then(function (img) {
      drawing = false;
      if (gen === paintGen) {
        if (base.width !== img.width || base.height !== img.height) {
          base.width = img.width;
          base.height = img.height;
          resetCache();
        }
        baseCtx.clearRect(0, 0, base.width, base.height);
        baseCtx.drawImage(img, 0, 0);
        noteSource(null, job.header && job.header.f === 'jxl' ? 'jxl' : (job.header && job.header.f === 'webp' ? 'wframe' : 'jpeg'), job.header && job.header.q);
        if (job.arrival > stillArrival) hideStill();
        frameReady(job.header);
        flushTiles();
        if (tabState === 'unresponsive') showTabStatus('ok');
      }
      releaseImage(img);
      paintQueued();
    }, function () {
      drawing = false;
      if (gen === paintGen) flushTiles();
      paintQueued();
    });
  }

  function flushTiles() {
    var queued = tileQueue;
    tileQueue = [];
    for (var q = 0; q < queued.length; q++) paintTiles(queued[q]);
  }

  // Changed tiles of the frame before them (kind 3): patched into base in arrival order.
  function drawTiles(header, body) {
    var job = { header: header, body: body, arrival: (frameArrival = ++arrivals) };
    noteClock(header.t);
    if (queuedJob) {
      queuedJob.tiles.push(job);
      return;
    }
    if (drawing) {
      tileQueue.push(job);
      return;
    }
    paintTiles(job);
  }

  // rows moved by a scroll pack: copied through a scratch canvas (one, reused) so overlapping moves read the
  // frame as it was
  var scratch = null;
  function moveRows(ops) {
    if (!ops || !ops.length || !base.width) return;
    if (!scratch) scratch = document.createElement('canvas');
    if (scratch.width !== base.width || scratch.height !== base.height) {
      scratch.width = base.width;
      scratch.height = base.height;
    }
    var sctx = scratch.getContext('2d');
    sctx.clearRect(0, 0, scratch.width, scratch.height);
    sctx.drawImage(base, 0, 0);
    for (var i = 0; i < ops.length; i++) {
      var op = ops[i];
      baseCtx.clearRect(0, op[0], base.width, op[2]);
      baseCtx.drawImage(scratch, 0, op[1], base.width, op[2], 0, op[0], base.width, op[2]);
    }
  }

  function paintTiles(job) {
    var h = job.header;
    var rects = h.rects || [];
    var ops = h.ops || null;
    if (!rects.length && !(ops && ops.length)) return;
    var gen = paintGen;
    var pos = 0;
    var decodes = [];
    var type = h.f === 'webp' ? 'image/webp' : 'image/jpeg';
    for (var r = 0; r < rects.length; r++) {
      decodes.push(decodeImage(job.body.subarray(pos, pos + rects[r].n), type).catch(function () { return null; }));
      pos += rects[r].n;
    }
    tileChain = tileChain.then(function () {
      return Promise.all(decodes);
    }).then(function (imgs) {
      if (gen === paintGen) {
        if (!base.width || !base.height) {
          base.width = h.width;
          base.height = h.height;
        }
        // a scroll pack moves the rows first; its tiles are what changed after the move
        moveRows(ops);
        if (ops) for (var oi = 0; oi < ops.length; oi++) noteSource([0, ops[oi][0], base.width, ops[oi][2]], 'moved');
        for (var i = 0; i < imgs.length; i++) {
          if (!imgs[i]) continue;
          var rect = rects[i];
          baseCtx.clearRect(rect.x, rect.y, rect.w, rect.h);
          baseCtx.drawImage(imgs[i], rect.x, rect.y, rect.w, rect.h);
          noteSource([rect.x, rect.y, rect.w, rect.h], h.f === 'webp' ? 'webp' : 'tile', h.q);
          // a small change patches the still (soft until the next one) instead of dropping it
          if (!stillCanvas.hidden && job.arrival > stillArrival) {
            // the still covers the view's rows (a frame also has the over-render band below them)
            var sx = stillCanvas.width / base.width;
            var sy = stillCanvas.height / viewRows();
            stillCtx.clearRect(rect.x * sx, rect.y * sy, rect.w * sx, rect.h * sy);
            stillCtx.drawImage(imgs[i], rect.x * sx, rect.y * sy, rect.w * sx, rect.h * sy);
          }
        }
        frameReady(h);
        if (tabState === 'unresponsive') showTabStatus('ok');
      }
      for (var j = 0; j < imgs.length; j++) releaseImage(imgs[j]);
    });
  }

  // Binary messages (server.js binaryMessage): [kind][u16 header length][JSON header][body]; audio is [2][f64 ms][Opus].
  // bytes and messages per kind (stats): 1 frames, 2 audio, 3 tiles, 4 scroll packs
  var traffic = {};
  function handleBinary(data) {
    var bytes = data instanceof Uint8Array ? data : new Uint8Array(data);
    if (!bytes.length) return;
    var kind = bytes[0];
    rxTotal += bytes.length;
    var t = traffic[kind] || (traffic[kind] = { n: 0, bytes: 0 });
    t.n += 1;
    t.bytes += bytes.length;
    if (kind === 2) {
      if (bytes.length > 9) audioPacket(new DataView(bytes.buffer, bytes.byteOffset, 9).getFloat64(1, true), bytes.subarray(9));
      return;
    }
    if (kind === 6) {
      var aheadHeaderLength = bytes[1] | (bytes[2] << 8);
      var aheadHeader = null;
      try { aheadHeader = JSON.parse(textDecoder.decode(bytes.subarray(3, 3 + aheadHeaderLength))); } catch (e) { return; }
      drawnAhead(aheadHeader, bytes.subarray(3 + aheadHeaderLength));
      return;
    }
    if (kind === 5) {
      var sheetHeaderLength = bytes[1] | (bytes[2] << 8);
      var sheetHeader = null;
      try { sheetHeader = JSON.parse(textDecoder.decode(bytes.subarray(3, 3 + sheetHeaderLength))); } catch (e) { return; }
      sheetPicture(sheetHeader, bytes.subarray(3 + sheetHeaderLength));
      return;
    }
    if (kind !== 1 && kind !== 3 && kind !== 4) {
      // an Alchemy from before #990: a bare JPEG
      drawBytes(bytes, null, bytes.length);
      return;
    }
    var headerLength = bytes[1] | (bytes[2] << 8);
    var header = null;
    try { header = JSON.parse(textDecoder.decode(bytes.subarray(3, 3 + headerLength))); } catch (e) { return; }
    var body = bytes.subarray(3 + headerLength);
    if (kind === 1) drawBytes(body, header, bytes.length);
    else drawTiles(header, body);
  }

  function base64Bytes(text) {
    var bin = atob(text);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  // ---- scrolling ahead of the page (#990) ----
  // A wheel turn or a scrollbar drag moves the picture at once, at the display's rate, instead of a round trip and
  // Alchemy's frame rate later. Only the document (the root scroller) of a desktop page, and only what scrolls: the
  // fixed bars along the top and bottom edges (bandTop / bandBottom, measured in the page) stay where they are.
  // Rows the frame does not have come from what was already seen (cache: the page around the view as it was drawn,
  // the over-render), else the page's own background until the frame with them arrives. When the input stops, the
  // frames have the last word: a page that did not scroll (it took the wheel itself) snaps back and is not guessed
  // for a while.
  var scrollInfo = { y: 0, height: 0, view: 0, x: 0, width: 0, viewWidth: 0, root: 1, bandTop: 0, bandBottom: 0 };
  var pred = { waitSeq: 0, ackSeq: 0, ackAt: 0, active: false, converging: false, target: 0, display: 0, startSy: 0, sum: 0, lastInput: 0, smooth: false, distrustUntil: 0, posted: null };
  var rafId = 0;
  var lastRafAt = 0;
  var bgColor = '';
  // What was seen of the page, by document row (Yukimi, Nov 21: "cache the previous scrolled areas so that when we
  // scroll back and we dont have new frames we can at least show the previous frame"): strips of STRIP_ROWS frame
  // rows, each knowing which of its rows it has. Up to CACHE_BUDGET pixels (from the device's memory); past it the
  // strips furthest from the view go first. Reset on a new page, a new width or pixel ratio.
  // Blocks of 1024 rows (Yukimi, Nov 21: "compile the scroll cache into layers of large strips"): a long page is a few
  // large canvases, not hundreds of small ones. Each row knows what it holds: 1 a frame's rows, 2 the still's (the
  // sharp picture at rest, server.js jxlRefine). A frame taken while scrolling leaves still rows as they are (the
  // view itself always shows the newest frame; the cache only fills rows the frame does not have), so coming back to
  // a place seen at rest shows it sharp at once; a frame at rest (the page changed) replaces them.
  var STRIP_ROWS = 1024;
  var SHARP = 2;
  var cacheLastSy = null;
  var CACHE_BUDGET = Math.max(12e6, Math.min(40e6, (Number(navigator.deviceMemory) || 4) * 5e6));
  var cache = { width: 0, k: 0, strips: new Map(), pixels: 0 };
  // The page's layers (server.js watchScroll, Yukimi Nov 21: separate the fixed background and the fixed layers on top
  // so nothing jumps): f = fixed and sticky elements drawn where they stay or stick, never moved with the page; vis =
  // where a fixed backdrop shows through (document CSS pixels), kept still from backdropCanvas (its pixels as last
  // seen at each place on the screen); cover = a full-screen layer on top (a dialog): no scrolling ahead.
  var layers = { f: [], cover: 0, backdrop: 0 };
  var visRects = [];
  // the document rows sampled for visRects; on other rows the backdrop is kept still in visCols (CSS x ranges where it
  // showed on nearly every sampled row: the page's margins)
  var visRanges = [];
  var visCols = [];
  var backdropCanvas = null;
  var backdropCtx = null;
  var keepCanvas = null;

  function requestComposite() {
    if (!rafId) rafId = requestAnimationFrame(composite);
  }

  // what painted a part of base (frame pixels; null: the whole frame): its codec and the quality it was encoded at
  function noteSource(rect, type, q, d) {
    var key = sourceKey(type, q, d);
    if (!rect) { baseSrc = [[0, 0, base.width, base.height, key]]; return; }
    baseSrc.push([rect[0], rect[1], rect[2], rect[3], key]);
    if (baseSrc.length > 400) baseSrc.splice(1, baseSrc.length - 300);
  }

  // a source as codec|class|quality: high, medium or low (JPEG / WebP quality, JPEG XL distance), or lossless
  function sourceKey(type, q, d) {
    var cls = '';
    var label = '';
    if (typeof d === 'number' && d >= 0) {
      cls = d === 0 ? 'lossless' : (d <= 0.8 ? 'high' : (d <= 1.5 ? 'medium' : 'low'));
      label = d === 0 ? 'lossless' : 'distance ' + d;
    } else if (typeof q === 'number') {
      cls = q >= 85 ? 'high' : (q >= 72 ? 'medium' : 'low');
      label = 'q' + q;
    }
    return type + '|' + cls + '|' + label;
  }

  // a class's strength: the lower the quality, the stronger the tint
  var CLASS_ALPHA = { lossless: 0.1, high: 0.18, medium: 0.32, low: 0.48, '': 0.28 };

        var box = entries[i].devicePixelContentBoxSize;
        if (box && box[0]) devicePx = { w: box[0].inlineSize, h: box[0].blockSize };
      }
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(sendViewport, 80);
    });
    try {
      observer.observe(canvas, { box: 'device-pixel-content-box' });
    } catch (e) {
      observer.observe(document.body);
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) setTimeout(sendViewport, 80);
  });
})();
</script>
