<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    overflow: hidden;
  }
  /* sized by the page; its backing store is the frame, which is the canvas's device pixels (#990: 1:1) */
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: default;
    touch-action: none;
  }
  /* the full-resolution still (zoomed or phone sessions): drawn over the frame until the next one */
  #still {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  #still[hidden] { display: none; }
  #tabStatus {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 24px;
    text-align: center;
    background: #1a1d24;
    color: #e8eaed;
    font: 16px/1.4 sans-serif;
  }
  #tabStatus[hidden] { display: none; }
  #tabStatus p { margin: 0; max-width: 36rem; }
  #tabStatusUrl { color: #9aa0a6; font-size: 13px; word-break: break-all; }
  #tabStatus button {
    margin-top: 8px;
    padding: 6px 12px;
    border: 1px solid #5f6368;
    border-radius: 4px;
    background: #2a2f38;
    color: inherit;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<canvas id="still" hidden></canvas>
<div id="tabStatus" hidden>
  <p id="tabStatusTitle"></p>
  <p id="tabStatusUrl"></p>
  <p id="tabStatusDetail"></p>
  <button type="button" id="tabStatusReload">Reload</button>
</div>
<script>
(function () {
  var canvas = document.getElementById('view');
  var ctx = canvas.getContext('2d', { alpha: false });
  var meta = { deviceWidth: 1280, deviceHeight: 800 };
  var params = new URLSearchParams(location.search);
  var token = params.get('t') || '';
  var parts = location.pathname.split('/');
  var sessionId = parts[parts.length - 1] || '';
  var relay = location.pathname.indexOf('/api/grimoire-browser/view/') !== -1;
  var socket = null;
  // #990: the viewer's own WebSocket (straight to Alchemy, or through Dreamscape's relay socket). Only when that
  // cannot open does it fall back to the NDJSON stream with one POST per input event.
  var fallback = false;
  var pendingClipboard = null;
  var pendingMenu = null;
  var inputUrl = relay
    ? '/api/grimoire-browser/sessions/' + encodeURIComponent(sessionId) + '/input?t=' + encodeURIComponent(token)
    : '';
  var outbound = [];
  var sending = false;
  var pendingMove = null;
  var moveTimer = 0;

  function isGesture(obj) {
    return obj && ((obj.type === 'mouse' && (obj.kind === 'down' || obj.kind === 'up' || obj.kind === 'click'))
      || (obj.type === 'touch' && obj.kind !== 'move'));
  }

  function dropQueuedMoves() {
    var kept = [];
    for (var i = 0; i < outbound.length; i++) {
      if (!(outbound[i].type === 'mouse' && outbound[i].kind === 'move')) kept.push(outbound[i]);
    }
    outbound = kept;
  }

  function pumpOutbound() {
    if (!fallback || sending || !outbound.length) return;
    sending = true;
    var obj = outbound.shift();
    fetch(inputUrl, {
      method: 'POST',
      credentials: 'same-origin',
      priority: isGesture(obj) ? 'high' : 'auto',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(obj)
    }).then(function (res) {
      if (!res.ok) throw new Error('input');
    }).catch(function () {
      if (isGesture(obj) && (obj.tries || 0) < 2) {
        obj.tries = (obj.tries || 0) + 1;
        outbound.unshift(obj);
      }
    }).then(function () {
      sending = false;
      pumpOutbound();
    });
  }

  function enqueueInput(obj) {
    if (!fallback) {
      if (socket && socket.readyState === 1) socket.send(JSON.stringify(obj));
      return;
    }
    if (obj.type === 'mouse' && obj.kind === 'move') {
      for (var i = outbound.length - 1; i >= 0; i--) {
        if (outbound[i].type === 'mouse' && outbound[i].kind === 'move') {
          outbound[i] = obj;
          pumpOutbound();
          return;
        }
      }
    }
    if (obj.type === 'touch' && obj.kind === 'move') {
      var last = outbound[outbound.length - 1];
      if (last && last.type === 'touch' && last.kind === 'move') {
        outbound[outbound.length - 1] = obj;
        pumpOutbound();
        return;
      }
    }
    if (obj.type === 'wheel' || obj.type === 'scroll-to') {
      var tail = outbound[outbound.length - 1];
      if (tail && tail.type === obj.type && !!tail.ctrl === !!obj.ctrl) {
        if (obj.type === 'wheel') {
          tail.deltaX += obj.deltaX;
          tail.deltaY += obj.deltaY;
        }
        tail.x = obj.x;
        tail.y = obj.y;
        pumpOutbound();
        return;
      }
    }
    if (isGesture(obj) || obj.type === 'key' || obj.type === 'wheel') dropQueuedMoves();
    outbound.push(obj);
    pumpOutbound();
  }

  function sendMove(obj) {
    pendingMove = obj;
    if (moveTimer) return;
    moveTimer = setTimeout(function () {
      moveTimer = 0;
      var move = pendingMove;
      pendingMove = null;
      if (move) enqueueInput(move);
    }, fallback ? 30 : 16);
  }

  function send(obj) {
    if (obj.type === 'mouse' && obj.kind === 'move') {
      sendMove(obj);
      return;
    }
    if (isGesture(obj) || obj.type === 'key' || obj.type === 'wheel') {
      pendingMove = null;
      if (moveTimer) {
        clearTimeout(moveTimer);
        moveTimer = 0;
      }
    }
    enqueueInput(obj);
  }

  // ---- clock (#990) ----
  // Frames (t) and audio packets carry Alchemy's clock. The smallest (arrival - stamp) seen is the fastest a message
  // has ever come; how far a frame or a packet is behind that is its delay, the same measure for picture and sound.
  var clock = { off: Infinity, at: 0 };
  function noteClock(stamp) {
    var now = Date.now();
    var gap = now - stamp;
    if (!isFinite(gap)) return;
    // clocks drift a little: the floor creeps up 0.2 ms a second until a faster message sets it again
    if (clock.off !== Infinity) clock.off += (now - clock.at) * 0.0002;
    clock.at = now;
    if (gap < clock.off) clock.off = gap;
  }

  // ---- frames ----
  // The newest frame is kept on an offscreen canvas (base) at its own scroll offset; what shows (canvas) is drawn
  // from it, moved by the scrolling the viewer is doing ahead of the page (prediction below).
  var stillCanvas = document.getElementById('still');
  var stillCtx = stillCanvas.getContext('2d', { alpha: false });
  var base = document.createElement('canvas');
  var baseCtx = base.getContext('2d', { alpha: false });
  // vh: frame rows of the page's viewport; rows below it are the over-render band (Alchemy build, #993)
  var baseInfo = { sy: 0, sx: 0, k: 0, p: 0, t: 0, vh: 0 };
  // Arrival order of frames and stills: a frame hides the still only if it came after it.
  var arrivals = 0;
  var stillArrival = 0;
  var frameArrival = 0;
  // byte size of the frame the last still was taken over: the relay can deliver that frame after
  // the still, and it must not hide it
  var stillBase = 0;
  var queuedJob = null;
  var drawing = false;
  var paintGen = 0;
  var tileQueue = [];
  var tileChain = Promise.resolve();
  var textDecoder = new TextDecoder();

  function decodeImage(bytes) {
    var blob = new Blob([bytes], { type: 'image/jpeg' });
    if (typeof createImageBitmap === 'function') return createImageBitmap(blob);
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(blob);
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
      img.src = url;
    });
  }

  function releaseImage(img) {
    if (img && typeof img.close === 'function') img.close();
  }

  function hideStill() {
    if (!stillCanvas.hidden) stillCanvas.hidden = true;
  }

  function drawStill(msg) {
    stillCount += 1;
    var arrival = stillArrival = ++arrivals;
    stillBase = msg.baseBytes || 0;
    // one still on the way at a time (Alchemy waits for this before the next)
    send({ type: 'still-ack' });
    var bin = atob(msg.data);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    decodeImage(bytes).then(function (img) {
      // a newer frame or still came first, or the still is not of the page's current CSS size
      // (frames can be smaller than that: the phone's Desktop view gets 780 px frames of 1024)
      if (arrival !== stillArrival || frameArrival > arrival
        || Math.abs(msg.cssW - (meta.deviceWidth || 0)) > 1.5 || Math.abs(msg.cssH - (meta.deviceHeight || 0)) > 1.5) {
        releaseImage(img);
        return;
      }
      if (stillCanvas.width !== img.width || stillCanvas.height !== img.height) {
        stillCanvas.width = img.width;
        stillCanvas.height = img.height;
      }
      stillCtx.drawImage(img, 0, 0);
      releaseImage(img);
      stillCanvas.hidden = false;
    }, function () {});
  }

  // A whole frame. header: t, sx, sy, k, p (server.js frameHeader); size: the message's length, for the still's base.
  function drawBytes(bytes, header, size) {
    var arrival;
    if (stillBase && size === stillBase && frameArrival < stillArrival) {
      // the still's own frame, delivered after it: older than the still
      arrival = stillArrival - 0.5;
    } else {
      arrival = ++arrivals;
    }
    stillBase = 0;
    frameArrival = arrival;
    if (header) noteClock(header.t);
    frameCount += 1;
    // a frame not drawn yet is replaced; the tiles that patched it go with it (the new frame has them)
    queuedJob = { bytes: bytes, header: header, arrival: arrival, tiles: [] };
    paintQueued();
  }

  function paintQueued() {
    if (drawing || !queuedJob) return;
    drawing = true;
    var job = queuedJob;
    queuedJob = null;
    tileQueue = job.tiles;
    var gen = ++paintGen;
    decodeImage(job.bytes).then(function (img) {
      drawing = false;
      if (gen === paintGen) {
        if (base.width !== img.width || base.height !== img.height) {
          base.width = img.width;
          base.height = img.height;
          resetCache();
        }
        baseCtx.drawImage(img, 0, 0);
        if (job.arrival > stillArrival) hideStill();
        frameReady(job.header);
        flushTiles();
        if (tabState === 'unresponsive') showTabStatus('ok');
      }
      releaseImage(img);
      paintQueued();
    }, function () {
      drawing = false;
      if (gen === paintGen) flushTiles();
      paintQueued();
    });
  }

  function flushTiles() {
    var queued = tileQueue;
    tileQueue = [];
    for (var q = 0; q < queued.length; q++) paintTiles(queued[q]);
  }

  // Changed tiles of the frame before them (kind 3): patched into base in arrival order.
  function drawTiles(header, body) {
    var job = { header: header, body: body, arrival: (frameArrival = ++arrivals) };
    noteClock(header.t);
    if (queuedJob) {
      queuedJob.tiles.push(job);
      return;
    }
    if (drawing) {
      tileQueue.push(job);
      return;
    }
    paintTiles(job);
  }

  function paintTiles(job) {
    var h = job.header;
    var rects = h.rects || [];
    if (!rects.length) return;
    var gen = paintGen;
    var pos = 0;
    var decodes = [];
    for (var r = 0; r < rects.length; r++) {
      decodes.push(decodeImage(job.body.subarray(pos, pos + rects[r].n)).catch(function () { return null; }));
      pos += rects[r].n;
    }
    tileChain = tileChain.then(function () {
      return Promise.all(decodes);
    }).then(function (imgs) {
      if (gen === paintGen) {
        if (!base.width || !base.height) {
          base.width = h.width;
          base.height = h.height;
        }
        for (var i = 0; i < imgs.length; i++) {
          if (!imgs[i]) continue;
          var rect = rects[i];
          baseCtx.drawImage(imgs[i], rect.x, rect.y, rect.w, rect.h);
          // a small change patches the still (soft until the next one) instead of dropping it
          if (!stillCanvas.hidden && job.arrival > stillArrival) {
            var sx = stillCanvas.width / base.width;
            var sy = stillCanvas.height / base.height;
            stillCtx.drawImage(imgs[i], rect.x * sx, rect.y * sy, rect.w * sx, rect.h * sy);
          }
        }
        frameReady(h);
        if (tabState === 'unresponsive') showTabStatus('ok');
      }
      for (var j = 0; j < imgs.length; j++) releaseImage(imgs[j]);
    });
  }

  // Binary messages (server.js binaryMessage): [kind][u16 header length][JSON header][body]; audio is [2][f64 ms][Opus].
  function handleBinary(data) {
    var bytes = data instanceof Uint8Array ? data : new Uint8Array(data);
    if (!bytes.length) return;
    var kind = bytes[0];
    if (kind === 2) {
      if (bytes.length > 9) audioPacket(new DataView(bytes.buffer, bytes.byteOffset, 9).getFloat64(1, true), bytes.subarray(9));
      return;
    }
    if (kind !== 1 && kind !== 3) {
      // an Alchemy from before #990: a bare JPEG
      drawBytes(bytes, null, bytes.length);
      return;
    }
    var headerLength = bytes[1] | (bytes[2] << 8);
    var header = null;
    try { header = JSON.parse(textDecoder.decode(bytes.subarray(3, 3 + headerLength))); } catch (e) { return; }
    var body = bytes.subarray(3 + headerLength);
    if (kind === 1) drawBytes(body, header, bytes.length);
    else drawTiles(header, body);
  }

  function base64Bytes(text) {
    var bin = atob(text);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  // ---- scrolling ahead of the page (#990) ----
  // A wheel turn or a scrollbar drag moves the picture at once, at the display's rate, instead of a round trip and
  // Alchemy's frame rate later. Only the document (the root scroller) of a desktop page, and only what scrolls: the
  // fixed bars along the top and bottom edges (bandTop / bandBottom, measured in the page) stay where they are.
  // Rows the frame does not have come from what was already seen (cache: the page around the view as it was drawn,
  // the over-render), else the page's own background until the frame with them arrives. When the input stops, the
  // frames have the last word: a page that did not scroll (it took the wheel itself) snaps back and is not guessed
  // for a while.
  var scrollInfo = { y: 0, height: 0, view: 0, x: 0, width: 0, viewWidth: 0, root: 1, bandTop: 0, bandBottom: 0 };
  var pred = { active: false, converging: false, target: 0, display: 0, startSy: 0, sum: 0, lastInput: 0, smooth: false, distrustUntil: 0, posted: null };
  var rafId = 0;
  var lastRafAt = 0;
  var bgColor = '';
  var CACHE_MAX_PIXELS = 12e6;
  var cache = { canvas: null, ctx: null, doc0: 0, valid0: 0, valid1: 0 };

  function requestComposite() {
    if (!rafId) rafId = requestAnimationFrame(composite);
  }

  function resetCache() {
    cache.valid0 = cache.valid1 = 0;
    bgColor = '';
  }

  // the frame rows that show: the viewport (a frame with an over-render band is taller)
  function viewRows() {
    return baseInfo.vh > 0 && baseInfo.vh < base.height ? baseInfo.vh : base.height;
  }

  function bands() {
    var k = baseInfo.k || 1;
    var height = viewRows();
    var top = Math.max(0, Math.min(height, Math.round((scrollInfo.bandTop || 0) * k)));
    var bottom = Math.max(0, Math.min(height - top, Math.round((scrollInfo.bandBottom || 0) * k)));
    return { m0: top, m1: height - bottom, top: top, bottom: bottom };
  }

  // the newest frame's middle (what scrolls) goes into the cache at its place in the document
  function cacheStore() {
    if (!baseInfo.p || !baseInfo.k || !scrollInfo.root) return;
    var width = base.width;
    var height = base.height;
    var rows = Math.min(height * 3, Math.floor(CACHE_MAX_PIXELS / Math.max(1, width)));
    if (rows < height * 1.5) return;
    if (!cache.canvas || cache.canvas.width !== width || cache.canvas.height !== rows) {
      cache.canvas = cache.canvas || document.createElement('canvas');
      cache.canvas.width = width;
      cache.canvas.height = rows;
      cache.ctx = cache.canvas.getContext('2d', { alpha: false });
      cache.valid0 = cache.valid1 = 0;
    }
    var b = bands();
    if (b.m1 - b.m0 <= 0) return;
    var docTop = Math.round(baseInfo.sy * baseInfo.k);
    var vh = viewRows();
    // what scrolls in the viewport, and the over-render band below it (the fixed bottom bar between them hides
    // its rows: they keep what an earlier frame showed, or the page's background)
    var segs = [[b.m0, b.m1]];
    if (vh < height) segs.push([vh, height]);
    var d0 = docTop + b.m0;
    var d1 = docTop + segs[segs.length - 1][1];
    if (d0 < cache.doc0 || d1 > cache.doc0 + rows) {
      // the cache window follows the page: centred on this band, keeping what still fits
      var doc0 = Math.max(0, Math.round((d0 + d1 - rows) / 2));
      var shift = doc0 - cache.doc0;
      if (cache.valid1 > cache.valid0 && Math.abs(shift) < rows) {
        cache.ctx.drawImage(cache.canvas, 0, -shift);
        cache.valid0 = Math.max(cache.valid0, doc0);
        cache.valid1 = Math.min(cache.valid1, doc0 + rows);
      } else {
        cache.valid0 = cache.valid1 = 0;
      }
      cache.doc0 = doc0;
    }
    if (segs.length > 1) {
      var h0 = docTop + b.m1;
      var h1 = docTop + vh;
      if (h1 > h0 && (h0 < cache.valid0 || h1 > cache.valid1)) {
        cache.ctx.fillStyle = pageBackground(b);
        cache.ctx.fillRect(0, h0 - cache.doc0, width, h1 - h0);
      }
    }
    for (var g = 0; g < segs.length; g++) {
      var rowsIn = segs[g][1] - segs[g][0];
      if (rowsIn > 0) cache.ctx.drawImage(base, 0, segs[g][0], width, rowsIn, 0, docTop + segs[g][0] - cache.doc0, width, rowsIn);
    }
    if (cache.valid1 <= cache.valid0 || d1 < cache.valid0 || d0 > cache.valid1) {
      cache.valid0 = d0;
      cache.valid1 = d1;
    } else {
      cache.valid0 = Math.min(cache.valid0, d0);
      cache.valid1 = Math.max(cache.valid1, d1);
    }
  }

  function pageBackground(b) {
    if (bgColor) return bgColor;
    try {
      var px = baseCtx.getImageData(Math.max(0, base.width - 2), Math.max(b.m0, b.m1 - 2), 1, 1).data;
      bgColor = 'rgb(' + px[0] + ',' + px[1] + ',' + px[2] + ')';
    } catch (e) {
      bgColor = '#fff';
    }
    return bgColor;
  }

  // rows [g0, g1) of the scrolling band that the frame does not cover, at document row doc0 + g0
  function fillGap(g0, g1, docAtTop, b) {
    if (g1 <= g0) return;
    var width = base.width;
    if (cache.canvas && cache.valid1 > cache.valid0) {
      var d0 = Math.max(docAtTop + g0, cache.valid0);
      var d1 = Math.min(docAtTop + g1, cache.valid1);
      if (d1 > d0) {
        ctx.drawImage(cache.canvas, 0, d0 - cache.doc0, width, d1 - d0, 0, d0 - docAtTop, width, d1 - d0);
        if (d0 - docAtTop > g0) fillRows(g0, d0 - docAtTop, b);
        if (d1 - docAtTop < g1) fillRows(d1 - docAtTop, g1, b);
        return;
      }
    }
    fillRows(g0, g1, b);
  }

  function fillRows(y0, y1, b) {
    if (y1 <= y0) return;
    ctx.fillStyle = pageBackground(b);
    ctx.fillRect(0, y0, base.width, y1 - y0);
  }

  function drawComposite(off) {
    var width = base.width;
    var height = viewRows();
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    if (!off) {
      ctx.drawImage(base, 0, 0, width, height, 0, 0, width, height);
      return;
    }
    var b = bands();
    var y0 = Math.max(b.m0, b.m0 - off);
    var y1 = Math.min(b.m1, b.m1 - off);
    var docAtTop = Math.round(baseInfo.sy * baseInfo.k) + off;
    if (y1 > y0) ctx.drawImage(base, 0, y0 + off, width, y1 - y0, 0, y0, width, y1 - y0);
    if (off > 0) fillGap(Math.max(b.m0, y1), b.m1, docAtTop, b);
    else fillGap(b.m0, Math.min(b.m1, y0), docAtTop, b);
    if (b.top) ctx.drawImage(base, 0, 0, width, b.top, 0, 0, width, b.top);
    if (b.bottom) ctx.drawImage(base, 0, b.m1, width, b.bottom, 0, b.m1, width, b.bottom);
  }

  function canPredict() {
    return !!(baseInfo.p && baseInfo.k > 0 && base.width && scrollInfo.root && scrollInfo.height > scrollInfo.view + 1
      && performance.now() >= pred.distrustUntil);
  }

  function maxScroll() {
    return Math.max(0, scrollInfo.height - scrollInfo.view);
  }

  function settleMs() {
    return Math.min(1500, (rttMs || 60) + 400);
  }

  function beginGesture() {
    if (pred.active) return;
    pred.active = true;
    pred.target = pred.display;
    pred.startSy = baseInfo.sy;
    pred.sum = 0;
  }

  // the page's CSS pixels for one of this window's (Grimoire's zoom; the same when 100 %)
  function remotePerLocal() {
    var local = canvas.clientWidth || 0;
    if (!local || !baseInfo.k) return 1;
    return (base.width / baseInfo.k) / local;
  }

  function predictWheel(dx, dy) {
    if (Math.abs(dy) <= Math.abs(dx) || !canPredict()) return;
    beginGesture();
    var amount = dy * remotePerLocal();
    pred.sum += amount;
    // a notch glides as it does in a local browser; a touchpad's small steps follow the fingers
    pred.smooth = Math.abs(dy) >= 40;
    pred.target = Math.max(0, Math.min(maxScroll(), pred.target + amount));
    pred.lastInput = performance.now();
    requestComposite();
  }

  function predictScrollTo(y) {
    if (!canPredict()) return;
    beginGesture();
    pred.smooth = false;
    pred.sum += y - pred.target;
    pred.target = Math.max(0, Math.min(maxScroll(), y));
    pred.lastInput = performance.now();
    requestComposite();
  }

  function finishGesture() {
    pred.active = false;
    // the picture glides to where the page really is (it lags behind its own smooth scroll, or did not move)
    pred.converging = true;
    // asked to move and the page stayed where it was: it took the wheel itself (a map, a carousel, an inner list)
    if (Math.abs(pred.sum) > 20 && Math.abs(baseInfo.sy - pred.startSy) < 1) pred.distrustUntil = performance.now() + 4000;
    postScroll(scrollInfo.y);
  }

  function postScroll(y) {
    var msg = scrollInfo;
    var key = Math.round(y) + ':' + msg.height + ':' + msg.view + ':' + msg.x + ':' + msg.width + ':' + msg.viewWidth;
    if (key === pred.posted) return;
    pred.posted = key;

      }
    }
    registerProcessor('alchemy-audio', AlchemyAudio);
  }

  function engineStart() {
    if (engine) return true;
    // it starts with room to spare (150 ms) and comes down to what the link needs as the numbers settle
    var e = { ctx: null, node: null, gain: null, decoder: null, ready: false, closed: false, pending: [], lagAvg: null, jitter: 15, underruns: 0, targetMs: 150 };
    try {
      e.ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
    } catch (err) {
      engineBroken = true;
      return false;
    }
    engine = e;
    var src = URL.createObjectURL(new Blob(['(' + audioWorkletMain.toString() + ')()'], { type: 'application/javascript' }));
    e.ctx.audioWorklet.addModule(src).then(function () {
      URL.revokeObjectURL(src);
      if (e.closed) return;
      e.node = new AudioWorkletNode(e.ctx, 'alchemy-audio', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
      e.node.port.onmessage = function (m) {
        if (m.data && m.data.underrun) e.underruns = Math.min(8, e.underruns + 1);
      };
      e.gain = e.ctx.createGain();
      e.gain.gain.value = audioVolume;
      e.node.connect(e.gain);
      e.gain.connect(e.ctx.destination);
      e.decoder = new AudioDecoder({
        output: function (data) { engineOutput(e, data); },
        error: function () {
          if (engine !== e) return;
          engineBroken = true;
          engineStop();
          if (audioWanted) startLegacyAudio();
        }
      });
      e.decoder.configure({ codec: 'opus', sampleRate: 48000, numberOfChannels: 2 });
      e.ready = true;
      var pending = e.pending;
      e.pending = [];
      for (var i = 0; i < pending.length; i++) engineDecode(e, pending[i].stamp, pending[i].data);
      if (e.ctx.state === 'suspended') e.ctx.resume().catch(function () {});
    }).catch(function () {
      URL.revokeObjectURL(src);
      if (engine !== e) return;
      engineBroken = true;
      engineStop();
      if (audioWanted) startLegacyAudio();
    });
    return true;
  }

  function engineStop() {
    var e = engine;
    if (!e) return;
    engine = null;
    e.closed = true;
    try { if (e.decoder && e.decoder.state !== 'closed') e.decoder.close(); } catch (err) {}
    try { if (e.node) e.node.disconnect(); } catch (err) {}
    if (e.ctx && e.ctx.state !== 'closed') e.ctx.close().catch(function () {});
  }

  function engineDecode(e, stamp, data) {
    try {
      e.decoder.decode(new EncodedAudioChunk({ type: 'key', timestamp: Math.round(stamp * 1000), data: data }));
    } catch (err) {}
  }

  function audioPacket(stamp, data) {
    noteClock(stamp);
    packetCount += 1;
    var e = engine;
    if (!e) return;
    if (!e.ready) {
      if (e.pending.length < 50) e.pending.push({ stamp: stamp, data: data.slice() });
      return;
    }
    engineDecode(e, stamp, data);
  }

  function noteVideoDelay(t) {
    if (!t || clock.off === Infinity) return;
    var delay = Date.now() - t - clock.off;
    if (delay < 0 || delay > 2000) return;
    videoDelay = videoDelay ? videoDelay * 0.9 + delay * 0.1 : delay;
  }

  function engineOutput(e, data) {
    if (engine !== e || !e.node) {
      data.close();
      return;
    }
    var frames = data.numberOfFrames;
    var left = new Float32Array(frames);
    var right = new Float32Array(frames);
    try {
      data.copyTo(left, { planeIndex: 0, format: 'f32-planar' });
      if (data.numberOfChannels > 1) data.copyTo(right, { planeIndex: 1, format: 'f32-planar' });
      else right.set(left);
    } catch (err) {
      data.close();
      return;
    }
    var stamp = data.timestamp / 1000;
    data.close();
    var now = Date.now();
    // how late this packet is beyond the fastest message seen, and how much that moves about
    var lag = Math.max(0, now - stamp - clock.off);
    e.lagAvg = e.lagAvg == null ? lag : e.lagAvg * 0.97 + lag * 0.03;
    e.jitter = e.jitter * 0.97 + Math.abs(lag - e.lagAvg) * 0.03;
    // enough delay that the buffer rarely runs dry, and at least the picture's, so the two meet
    var need = e.lagAvg + 3 * e.jitter + 20 + e.underruns * 15;
    var want = Math.min(600, Math.max(40, Math.max(need, videoDelay || 0)));
    // up at once (it ran short), down slowly
    e.targetMs = want > e.targetMs ? e.targetMs * 0.7 + want * 0.3 : e.targetMs * 0.99 + want * 0.01;
    var outLatency = ((e.ctx.outputLatency || 0) + (e.ctx.baseLatency || 0)) * 1000;
    // samples to have queued so this packet's last sample is heard targetMs after the fastest it could have been
    var targetSamples = (e.targetMs + stamp + frames / 48 + clock.off - now - outLatency) * 48;
    e.node.port.postMessage({ l: left, r: right, target: Math.max(480, Math.round(targetSamples)) }, [left.buffer, right.buffer]);
  }

  // Also the retry after the stream gave up: any click or key in the page asks again.
  function playAudio() {
    if (!audioWanted) return;
    if (audioTaken) {
      audioTaken = false;
      startAudioPath();
      return;
    }
    if (engine) {
      if (engine.ctx.state === 'suspended') engine.ctx.resume().catch(function () {});
      return;
    }
    if (!audio) {
      audioFails = 0;
      startAudioPath();
      return;
    }
    if (audio.paused) audio.play().catch(function () {});
  }

  function startAudioPath() {
    if (engineSupported() && engineStart()) {
      if (connected) send({ type: 'audio', on: true });
      return;
    }
    startLegacyAudio();
  }

  // A live stream keeps buffering: play a little faster until it is caught up (seeking was a gap every time).
  function trimAudioLag() {
    if (!audio || audio.paused || !audio.buffered.length) return;
    var behind = audio.buffered.end(audio.buffered.length - 1) - audio.currentTime;
    var rate = behind > 0.8 ? 1.06 : (behind > 0.35 ? 1.03 : 1);
    if (audio.playbackRate !== rate) audio.playbackRate = rate;
  }

  function stopLegacyAudio() {
    clearInterval(audioTrimTimer);
    audioTrimTimer = 0;
    if (!audio) return;
    var el = audio;
    audio = null;
    el.pause();
    el.removeAttribute('src');
    el.load();
  }

  function startLegacyAudio() {
    if (audio || !audioWanted) return;
    var el = new Audio(audioUrl + '&n=' + Date.now());
    el.volume = audioVolume;
    el.preservesPitch = true;
    audio = el;
    el.addEventListener('playing', function () { audioFails = 0; });
    // Another window taking the stream, an Alchemy restart, or a network drop ends it; keep coming back while wanted.
    var lost = function () {
      if (audio !== el) return;
      stopLegacyAudio();
      audioFails += 1;
      if (audioWanted && audioFails < 6) setTimeout(startLegacyAudio, Math.min(10000, 1000 * audioFails));
    };
    el.addEventListener('error', lost);
    el.addEventListener('ended', lost);
    el.play().catch(function () {});
    audioTrimTimer = setInterval(trimAudioLag, 1000);
  }

  // The parent turns audio on for the focused Alchemy window only; the server ends any other listener.
  function setAudio(on, volume) {
    if (typeof volume === 'number') audioVolume = Math.max(0, Math.min(1, volume));
    if (audio) audio.volume = audioVolume;
    if (engine && engine.gain) engine.gain.gain.value = audioVolume;
    if (on === audioWanted) return;
    audioWanted = on;
    audioFails = 0;
    audioTaken = false;
    if (on) {
      startAudioPath();
      return;
    }
    if (engine) {
      send({ type: 'audio', on: false });
      engineStop();
    }
    stopLegacyAudio();
  }

  // Mouse side buttons are Back / Forward for the remote page, not a click, and never the Dreamscape tab's own history.
  function sideButton(ev) {
    return ev.button === 3 || ev.button === 4;
  }
  function historyGo(dir) {
    postParent({ type: 'grimoire-browser-history-intent', dir: dir });
    send({ type: 'history', dir: dir });
  }
  ['mousedown', 'mouseup', 'auxclick'].forEach(function (name) {
    canvas.addEventListener(name, function (ev) {
      if (sideButton(ev)) ev.preventDefault();
    });
  });

  canvas.addEventListener('pointerdown', function (ev) {
    playAudio();
    if (ev.button === 2) return;
    if (sideButton(ev)) {
      ev.preventDefault();
      return;
    }
    canvas.focus();
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'grimoire-browser-focus' }, '*');
    }
    ev.preventDefault();
    var p = mapPoint(ev);
    press = { x: p.x, y: p.y, button: buttonName(ev.button), pointerId: ev.pointerId };
    var body = mouseBody(ev, p);
    body.kind = 'down';
    send(body);
  });
  canvas.addEventListener('pointerup', function (ev) {
    if (ev.button === 2) return;
    ev.preventDefault();
    if (sideButton(ev)) {
      historyGo(ev.button === 3 ? -1 : 1);
      return;
    }
    var p = mapPoint(ev);
    var tap = press && press.pointerId === ev.pointerId && press.button === buttonName(ev.button)
      && Math.hypot(p.x - press.x, p.y - press.y) < 6;
    var origin = press ? { x: press.x, y: press.y } : p;
    var replaced = false;
    if (tap && fallback) {
      for (var i = outbound.length - 1; i >= 0; i--) {
        if (outbound[i].type === 'mouse' && outbound[i].kind === 'down' && outbound[i].button === press.button) {
          outbound[i] = mouseBody(ev, origin);
          outbound[i].kind = 'click';
          replaced = true;
          break;
        }
      }
    }
    press = null;
    if (replaced) {
      pumpOutbound();
      return;
    }
    var body = mouseBody(ev, tap ? origin : p);
    body.kind = 'up';
    send(body);
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!connected) return;
    var p = mapPoint(ev);
    send({ type: 'mouse', kind: 'move', x: p.x, y: p.y });
  });
  // One wheel message per animation frame, deltas in pixels, at the pointer: a trackpad fires far more often than
  // the link can carry, and a backlog of tiny scrolls is what made scrolling stutter. The picture moves at once
  // (predictWheel).
  var wheelAcc = null;
  var wheelRaf = 0;
  function flushWheel() {
    wheelRaf = 0;
    var wheel = wheelAcc;
    wheelAcc = null;
    if (wheel && (wheel.deltaX || wheel.deltaY)) send(wheel);
  }
  canvas.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var scale = ev.deltaMode === 1 ? 40 : (ev.deltaMode === 2 ? (canvas.clientHeight || 800) : 1);
    var p = mapPoint(ev);
    var ctrl = !!(ev.ctrlKey || ev.metaKey);
    if (wheelAcc && wheelAcc.ctrl !== ctrl) flushWheel();
    if (!wheelAcc) wheelAcc = { type: 'wheel', x: p.x, y: p.y, deltaX: 0, deltaY: 0, ctrl: ctrl, shift: !!ev.shiftKey };
    wheelAcc.x = p.x;
    wheelAcc.y = p.y;
    wheelAcc.deltaX += ev.deltaX * scale;
    wheelAcc.deltaY += ev.deltaY * scale;
    if (!ctrl && !ev.shiftKey) predictWheel(ev.deltaX * scale, ev.deltaY * scale);
    if (!wheelRaf) wheelRaf = requestAnimationFrame(flushWheel);
  }, { passive: false });
  canvas.addEventListener('contextmenu', function (ev) {
    ev.preventDefault();
    var p = mapPoint(ev);
    pendingMenu = { clientX: ev.clientX, clientY: ev.clientY };
    send({ type: 'inspect', x: p.x, y: p.y });
  });

  // Ctrl+V is left to the browser so a paste event brings the text with no permission prompt (works on plain http);
  // if none comes, the Clipboard API (or the parent) reads it.
  var pasteFallback = 0;
  window.addEventListener('paste', function (ev) {
    ev.preventDefault();
    clearTimeout(pasteFallback);
    pasteFallback = 0;
    var text = ev.clipboardData ? ev.clipboardData.getData('text/plain') : '';
    if (text) send({ type: 'paste', text: text });
  });

  window.addEventListener('keydown', function (ev) {
    playAudio();
    var mod = ev.ctrlKey || ev.metaKey;
    if (mod && !ev.altKey && (ev.key === 'c' || ev.key === 'C')) {
      ev.preventDefault();
      requestClipboardCopy(false);
      return;
    }
    if ((mod && !ev.altKey && (ev.key === 'v' || ev.key === 'V')) || (ev.shiftKey && ev.key === 'Insert')) {
      clearTimeout(pasteFallback);
      pasteFallback = setTimeout(function () {
        pasteFallback = 0;
        readLocalClipboard();
      }, 150);
      return;
    }
    if (mod && !ev.altKey && (ev.key === 'x' || ev.key === 'X')) {
      ev.preventDefault();
      requestClipboardCopy(true);
      return;
    }
    if ((ev.altKey && !mod && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) || ev.key === 'BrowserBack' || ev.key === 'BrowserForward') {
      ev.preventDefault();
      historyGo(ev.key === 'ArrowRight' || ev.key === 'BrowserForward' ? 1 : -1);
      return;
    }
    // Grimoire's tab keys (public/scripts/comp/grimoireRemoteBrowser.js grimoireTabShortcut): the window switches tabs
    var tabCommand = '';
    if (mod && !ev.altKey) {
      if (ev.key === 'Tab') tabCommand = ev.shiftKey ? 'prev-tab' : 'next-tab';
      else if (!ev.shiftKey && (ev.key === 't' || ev.key === 'T')) tabCommand = 'new-tab';
      else if (!ev.shiftKey && (ev.key === 'w' || ev.key === 'W' || ev.key === 'F4')) tabCommand = 'close-tab';
      else if (!ev.shiftKey && (ev.key === 'q' || ev.key === 'Q')) tabCommand = 'quick-tabs';
      else if (!ev.shiftKey && (ev.key === 'n' || ev.key === 'N')) tabCommand = 'new-window';
    }
    if (tabCommand) {
      ev.preventDefault();
      postParent({ type: 'grimoire-browser-shortcut', command: tabCommand });
      return;
    }
    ev.preventDefault();
    send(keyPayload(ev, 'down'));
  });
  window.addEventListener('keyup', function (ev) {
    ev.preventDefault();
    send(keyPayload(ev, 'up'));
  });

  window.addEventListener('message', function (ev) {
    var data = ev.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'grimoire-browser-navigate' && typeof data.url === 'string') {
      send({ type: 'navigate', url: data.url });
    } else if (data.type === 'grimoire-browser-visibility') {
      // the tab went behind another or came back (#756): only what shows is captured
      send({ type: 'visibility', hidden: !!data.hidden });
    } else if (data.type === 'grimoire-browser-memory-override') {
      send({ type: 'memory-override' });
    } else if (data.type === 'grimoire-browser-reload') {
      send({ type: 'reload' });
    } else if (data.type === 'grimoire-browser-zoom' && typeof data.value === 'number') {
      send({ type: 'zoom', value: data.value });
    } else if (data.type === 'grimoire-browser-scale' && typeof data.value === 'number') {
      // device pixels per page CSS pixel wanted for stills (Internet Explorer on the phone, #709)
      send({ type: 'still-scale', value: data.value });
    } else if (data.type === 'grimoire-browser-print') {
      send({ type: 'print', id: String(data.id || '') });
    } else if (data.type === 'grimoire-browser-dialog-reply' && data.id) {
      send({
        type: 'dialog-reply',
        id: data.id,
        accept: !!data.accept,
        text: data.text || '',
        username: data.username || '',
        password: data.password || ''
      });
    } else if (data.type === 'grimoire-browser-scroll-to' && typeof data.y === 'number') {
      predictScrollTo(data.y);
      send(typeof data.x === 'number' ? { type: 'scroll-to', y: data.y, x: data.x } : { type: 'scroll-to', y: data.y });
    } else if (data.type === 'grimoire-browser-touch' && /^(start|move|end|cancel)$/.test(data.kind)
      && typeof data.x === 'number' && typeof data.y === 'number') {
      // a finger on the phone's page (Internet Explorer on the phone): x, y in this window's CSS pixels
      if (data.kind === 'start') {
        playAudio();
        if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'grimoire-browser-focus' }, '*');
      }
      var tp = mapPoint({ clientX: data.x, clientY: data.y });
      send({ type: 'touch', kind: data.kind, x: tp.x, y: tp.y, t: Number(data.t) || 0, tap: !!data.tap });
    } else if (data.type === 'grimoire-browser-history' && (data.dir === 1 || data.dir === -1)) {
      historyGo(data.dir);
    } else if (data.type === 'grimoire-browser-file-chooser-reply' && typeof data.id === 'string') {
      send({ type: 'file-chooser-reply', id: data.id, cancel: !!data.cancel });
    } else if (data.type === 'grimoire-browser-audio') {
      setAudio(!!data.on, data.volume);
    } else if (data.type === 'grimoire-browser-download-cancel' && typeof data.id === 'string') {
      send({ type: 'download-cancel', id: data.id });
    } else if (data.type === 'grimoire-browser-select-pick' && typeof data.index === 'number') {
      send({ type: 'select-pick', index: data.index });
    } else if (data.type === 'grimoire-browser-settings' && data.settings) {
      send({
        type: 'settings',
        jpegQuality: data.settings.jpegQuality,
        minFps: data.settings.minFps,
        maxFps: data.settings.maxFps,
        regionQuality: data.settings.regionQuality
      });
    } else if (data.type === 'grimoire-browser-paste' && typeof data.text === 'string' && data.text) {
      send({ type: 'paste', text: data.text });
    } else if (data.type === 'grimoire-browser-key' && data.kind) {
      canvas.focus();
      send({
        type: 'key',
        kind: data.kind,
        key: data.key || '',
        code: data.code || '',
        text: data.text || '',
        shift: !!data.shift,
        ctrl: !!data.ctrl,
        alt: !!data.alt
      });
    }
  });

  if (typeof ResizeObserver === 'function') {
    var resizeTimer = 0;
    var observer = new ResizeObserver(function (entries) {
      for (var i = 0; i < entries.length; i++) {
        var box = entries[i].devicePixelContentBoxSize;
        if (box && box[0]) devicePx = { w: box[0].inlineSize, h: box[0].blockSize };
      }
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(sendViewport, 80);
    });
    try {
      observer.observe(canvas, { box: 'device-pixel-content-box' });
    } catch (e) {
      observer.observe(document.body);
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) setTimeout(sendViewport, 80);
  });
})();
</script>
</body>
</html>
