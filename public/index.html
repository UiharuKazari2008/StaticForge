    <!-- Development Bridge Client (only loads in development mode) -->
    <script>
        // Check if development mode is enabled via localStorage
        if (localStorage.getItem('staticforge_dev_mode') === 'true') {
            const script = document.createElement('script');
            script.src = '/scripts/devBridgeClient.js';
            script.async = true;
            document.head.appendChild(script);
        }
        try {
            if (localStorage.getItem('staticforge_dev_mode') === 'true') {
                document.cookie = 'staticforge_dev_mode=1; path=/; SameSite=Lax';
            } else {
                document.cookie = 'staticforge_dev_mode=; path=/; Max-Age=0';
            }
        } catch (e) { /* ignore */ }
    </script>

    <script>window.isLoginPage = true;</script>

<body class="login-booting">
    <!-- Window Controls Overlay API - Titlebar Grab Area -->
    <div id="titlebar-grab-area">
        <div id="titlebar-null-left"></div>
        <div id="titlebar-grab-center"></div>
        <div id="titlebar-null-right"></div>
    </div>

    <!-- Background Image System using CSS Sprite Sheet -->
    <div class="background-container">
        <div class="bg-layer" id="bg-layer"></div>
        <div class="blur-layer" id="blur-layer"></div>
        <div class="block-container">
            <!-- Blocks generated dynamically -->
        </div>
    </div>

    <!-- Product Name Top Left -->
    <div class="login-product-name">
        <i class="mdi mdi-1-5 mdi-image-auto-adjust" aria-hidden="true"></i>
        <span>Dreamscape</span>
    </div>

    <div class="login-container minimize">
        <div class="login-dialog">
            <div class="pin-display" role="button" tabindex="0" aria-expanded="false" aria-label="Show PIN pad">
                <div class="pin-dots">
                    <div class="pin-dot" data-index="0"></div>
                    <div class="pin-dot" data-index="1"></div>
                    <div class="pin-dot" data-index="2"></div>
                    <div class="pin-dot" data-index="3"></div>
                    <div class="pin-dot" data-index="4"></div>
                    <div class="pin-dot" data-index="5"></div>
                </div>
            </div>
            <div class="pin-pad">
                <div class="pin-row">
                    <button class="pin-button" data-number="1" aria-label="1"><i class="fas fa-1" aria-hidden="true"></i></button>
                    <button class="pin-button" data-number="2" aria-label="2"><i class="fas fa-2" aria-hidden="true"></i></button>
                    <button class="pin-button" data-number="3" aria-label="3"><i class="fas fa-3" aria-hidden="true"></i></button>
                </div>
                <div class="pin-row">
                    <button class="pin-button" data-number="4" aria-label="4"><i class="fas fa-4" aria-hidden="true"></i></button>
                    <button class="pin-button" data-number="5" aria-label="5"><i class="fas fa-5" aria-hidden="true"></i></button>
                    <button class="pin-button" data-number="6" aria-label="6"><i class="fas fa-6" aria-hidden="true"></i></button>
                </div>
                <div class="pin-row">
                    <button class="pin-button" data-number="7" aria-label="7"><i class="fas fa-7" aria-hidden="true"></i></button>
                    <button class="pin-button" data-number="8" aria-label="8"><i class="fas fa-8" aria-hidden="true"></i></button>
                    <button class="pin-button" data-number="9" aria-label="9"><i class="fas fa-9" aria-hidden="true"></i></button>
                </div>
                <div class="pin-row">
                    <button class="pin-button clear-btn danger" data-action="clear" aria-label="Clear PIN" title="Clear PIN">
                        <i class="fas fa-c" aria-hidden="true"></i>
                    </button>
                    <button class="pin-button" data-number="0" aria-label="0"><i class="fas fa-0" aria-hidden="true"></i></button>
                    <button class="pin-button backspace-btn danger" data-action="backspace" aria-label="Backspace" title="Backspace">
                        <i class="fas fa-delete-left" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="pin-row options">
                    <button class="pin-button update-static-btn" data-action="update-static" aria-label="Update application data" title="Update application data">
                        <i class="fas fa-sync-alt" aria-hidden="true"></i>
                    </button>
                    <button class="pin-button cache-clear-btn danger" data-action="cache-clear" aria-label="Clear cache and repair" title="Clear cache and repair">
                        <i class="fas fa-monitor-waveform" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <div id="errorMessage" class="error-message hidden" aria-live="polite"></div>

            <!-- Asset Loading Progress -->
            <div id="assetLoadingProgress" class="asset-loading-progress hidden">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-status" id="progressStatus">Initializing...</div>
            </div>
        </div>
    </div>
</body>
