    <!-- Spellbook Generation Modal -->
    <div id="spellbookGenerationModal" class="modal hidden" data-window-client="light">
        <div class="modal-window-title">
            <div class="modal-window-title-main">
                <i class="fas fa-hat-wizard icon-fa"></i>
                <img src="/static_images/app_icons/24/spellcaster.webp" srcset="/static_images/app_icons/24/spellcaster.webp 1x, /static_images/app_icons/48/spellcaster.webp 2x" alt="" class="icon-image" />
                <span>Spellcaster</span>
            </div>
        </div>
        <div class="modal-focus-overlay"></div>
        <div class="modal-window-controls">
            <button type="button" class="btn-secondary minimize-btn btn-small" title="Minimize">
                <i class="fa-regular fa-window-minimize"></i>
            </button>
            <button type="button" id="closeSpellbookModalBtn" class="btn-danger close-btn btn-small" title="Close"><i
                    class="fa-regular fa-xmark-large"></i></button>
        </div>
        <div class="modal-content modal-padding dark">
            <!-- the picture's commands; Expand Canvas and Upscale wear Photo Gallery's viewer glyphs
                 (Actual Size, Zoom: PhotoLibraryResources PNG 4179 / 4019) -->
            <div class="explorer-actions-header spellbook-command-bar" role="toolbar">
                <div class="explorer-command-set">
                    <button type="button" id="spellbookDownloadBtn" class="btn-secondary btn-small explorer-command-btn"
                        title="Save a copy of the picture" disabled><img loading="lazy" decoding="async" class="explorer-command-icon"
                            src="/static_images/vista-cmdbar/save.png" alt="">Save a Copy</button>
                    <button type="button" id="spellbookCopyBtn" class="btn-secondary btn-small explorer-command-btn"
                        title="Copy the picture" disabled><img loading="lazy" decoding="async" class="explorer-command-icon"
                            src="/static_images/vista-cmdbar/copy.png" alt="">Copy</button>
                    <button type="button" id="spellbookExpandBtn" class="btn-secondary btn-small explorer-command-btn"
                        title="Expand Canvas" disabled><img loading="lazy" decoding="async" class="explorer-command-icon"
                            src="/static_images/vista-cmdbar/expand-canvas.png" alt="">Expand Canvas</button>
                    <button type="button" id="spellbookUpscaleBtn" class="btn-secondary btn-small explorer-command-btn hidden"
                        title="Upscale the picture" disabled><img loading="lazy" decoding="async" class="explorer-command-icon"
                            src="/static_images/vista-cmdbar/upscale.png" alt=""><span>Upscale</span></button>
                </div>
                <div class="explorer-command-set">
                    <button type="button" id="spellbookGoToWorkspaceBtn" class="btn-secondary btn-small explorer-command-btn"
                        title="Teleport to the planet the picture was cast on" disabled><img loading="lazy" decoding="async" class="explorer-command-icon"
                            src="/static_images/app_icons/24/planet.webp" alt="">Teleport</button>
                </div>
            </div>
            <div class="modal-body">
                <div class="spellbook-modal-layout">
                    <!-- Preview Container -->
                    <div class="spellbook-preview-container">
                        <div class="spellbook-preview-image-container">
                            <!-- Animation Layers -->
                            <!-- Stars Layer -->
                            <div id="spellbookPreviewStars" class="preview-stars hidden">
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <!-- Additional 15 stars for top, bottom, and edges -->
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                                <div class="preview-star"></div>
                            </div>

                            <!-- Background Lines Layer (behind content) -->
                            <div id="spellbookPreviewBackgroundLines"
                                class="preview-lines-layer preview-lines-background hidden">
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                            </div>

                            <!-- Blur background layers -->
                            <div id="spellbookBlurBackground1" class="spellbook-blur-background"></div>
                            <div id="spellbookBlurBackground2" class="spellbook-blur-background"></div>

                            <!-- Rentan Progress Overlay -->
                            <div id="spellbookDynamicGenerationProgressOverlay"
                                class="dynamic-generation-progress-overlay hidden">
                                <!-- Left Top: Time and Season Data -->
                                <div class="progress-time-section">
                                    <div class="progress-time-info" id="spellbookProgressTimeInfo">
                                        <span class="progress-time" id="spellbookProgressTime">--:--</span>
                                        <span class="progress-date" id="spellbookProgressDate">--/--</span>
                                    </div>
                                    <div class="progress-season-info">
                                        <span class="progress-holiday" id="spellbookProgressHoliday"></span>
                                        <span class="progress-season" id="spellbookProgressSeason">Season</span>
                                    </div>
                                </div>

                                <!-- Right Top: Weather -->
                                <div class="progress-weather-section">
                                    <div class="overlay-weather-section">
                                        <div class="overlay-weather-info">
                                            <div class="overlay-weather-feels-like"
                                                id="spellbookProgressWeatherFeelsLike">
                                                <span class="temp-number">--</span>
                                                <span class="temp-unit">°C</span>
                                            </div>
                                            <div class="overlay-weather-condition"
                                                id="spellbookProgressWeatherCondition">Unknown</div>
                                            <div class="overlay-weather-condition" id="spellbookProgressWeatherLocation"
                                                class="hidden">Unknown</div>
                                        </div>
                                        <div class="overlay-weather-icon" id="spellbookProgressWeatherIcon">
                                            <span class="weather-fallback-icon">🌤️</span>
                                        </div>
                                    </div>
                                </div>

                                <!-- Inner Container for Reasoning Items -->
                                <div class="progress-reasoning-container" id="spellbookProgressReasoningContainer">
                                </div>
                                <div class="dynamic-generation-progress-cancel-wrap">
                                    <button type="button" id="spellbookDynamicGenerationProgressCancelBtn"
                                        class="btn-secondary btn-small">Cancel</button>
                                </div>
                            </div>

                            <!-- Rentan Overlay -->
                            <div id="spellbookDynamicGenerationOverlay" class="dynamic-generation-overlay hidden">
                                <div id="spellbookDynamicGenerationOverlayBody" class="dynamic-generation-overlay-body">
                                    <div class="overlay-weather-section">
                                        <div class="overlay-weather-info">
                                            <div class="overlay-weather-feels-like"
                                                id="spellbookOverlayWeatherFeelsLike">
                                                <span class="temp-number">--</span>
                                                <span class="temp-unit">°C</span>
                                            </div>
                                            <div class="overlay-weather-condition"
                                                id="spellbookOverlayWeatherCondition">Unknown</div>
                                            <div class="overlay-weather-condition" id="spellbookOverlayWeatherLocation"
                                                class="hidden">Unknown</div>
                                        </div>
                                        <div class="overlay-weather-icon" id="spellbookOverlayWeatherIcon">
                                            <span class="weather-fallback-icon">🌤️</span>
                                        </div>
                                    </div>
                                    <div class="overlay-time-section">
                                        <div id="spellbookOverlayTimeDisplay" class="overlay-time">--:--</div>
                                    </div>
                                </div>
                            </div>

                            <img id="spellbookPreviewImage" src="" alt="Preview" class="spellbook-preview-image hidden">
                            <!-- Confetti container for spellbook modal -->
                            <div id="spellbookConfettiContainer" class="confetti-container"></div>

                            <!-- Foreground Lines Layer (above content) -->
                            <div id="spellbookPreviewForegroundLines"
                                class="preview-lines-layer preview-lines-foreground hidden">
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                                <div class="preview-line"></div>
                            </div>

                        </div>
                    </div>

                    <!-- Controls Container -->
                    <div class="spellbook-controls-container form-row">
                        <!-- Spellbook Preset Dropdown -->
                        <div id="spellbookCustomPresetDropdown" class="custom-dropdown preset-menu dark dropup">
                            <div class="button-group">
                                <button type="button" id="spellbookCustomPresetDropdownBtn" class="btn-secondary">
                                    <span id="spellbookCustomPresetSelected"><i class="fa-light fa-book-spells"></i>
                                        Select Spell...</span>
                                </button>
                                <button type="button" id="spellbookClearPresetBtn" class="btn-secondary hidden"
                                    title="Clear preset selection">
                                    <i class="fas fa-times"></i><span class="vista-label">Clear</span>
                                </button>
                                <!-- Editor Button -->
                                <button type="button" id="spellbookEditorBtn" class="btn-secondary" disabled
                                    title="Create a masterpiece!">
                                    <i class="fa-solid fa-compass-drafting"></i><span class="vista-label">Edit...</span>
                                </button>
                            </div>
                            <div id="spellbookCustomPresetDropdownMenu" class="custom-dropdown-menu hidden"></div>
                            <input type="hidden" id="presetSelect" value="">
                        </div>
                        <!-- Generate Button -->
                        <button type="button" id="spellbookGenerateBtn" class="btn-primary" data-dialog-primary="1" disabled>
                            <i class="fas fa-wand-sparkles"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
