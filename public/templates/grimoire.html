    <div id="tagWikiSearchModal" class="modal toolbar-visible hidden resizeable-window"

        data-window-min-width="650" data-window-min-height="600">
        <div class="modal-window-title">
            <div class="modal-window-title-main">
                <i class="fas fa-book icon-fa"></i>
                <img src="/static_images/app_icons/24/vista-iexplore.webp" srcset="/static_images/app_icons/24/vista-iexplore.webp 1x, /static_images/app_icons/48/vista-iexplore.webp 2x" alt="" class="icon-image" />
                <span>Grimoire</span>
            </div>
            <div class="modal-window-title-toolbar">
                <div class="button-group">
                    <button type="button" class="btn-secondary toolbar-input-segment" id="tagWikiSearchBackBtn"
                        title="Back">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <button type="button" class="btn-secondary toolbar-input-segment" id="tagWikiSearchForwardBtn"
                        title="Forward">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
                <button type="button" class="btn-secondary" id="tagWikiSearchHomeBtn" title="Home">
                    <i class="fas fa-home"></i>
                </button>
                <!-- Two-layer pseudo-browser address bar (replaces plain search+refresh group).
                     Display layer (icon + path) is on top; edit layer (real input + refresh) sits underneath
                     and is revealed on click of display or hover of the address bar group. -->
                <div class="wiki-address-bar" id="grimoireAddressBar" data-protocol="edtx">
                    <!-- Top / visible display layer -->
                    <div class="address-display-layer" id="grimoireAddressDisplay" tabindex="0"
                        title="Click or hover to edit address / search">
                        <i class="address-mode-icon fas fa-book" id="grimoireAddressModeIcon" aria-hidden="true"></i>
                        <span class="address-path" id="grimoireAddressPath">edtx://en.grimoire.jp/index.dtxt</span>
                    </div>
                    <!-- Lower / hidden edit layer (contains the original input + refresh for compatibility) -->
                    <!-- a form of its own: an on-screen keyboard offers Go (not Next to the window's other boxes) -->
                    <form class="address-edit-layer hidden" id="grimoireAddressEdit" action="#" novalidate>
                        <input type="text" id="tagWikiSearchInput"
                            class="form-control colored tag-wiki-search-bar toolbar-input-segment"
                            placeholder="Search, a wiki address, or a site such as bing.com"
                            autocapitalize="false" autocorrect="false" spellcheck="false" enterkeyhint="go">
                        <button type="button" id="tagWikiSearchRefreshBtn" class="btn-secondary toolbar-input-segment"
                            title="Refresh">
                            <i class="fas fa-sync"></i>
                        </button>
                    </form>
                </div>
                <button type="button" class="btn-secondary" id="grimoireAddressSiteBtn" title="Menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
        <div class="modal-focus-overlay"></div>
        <div class="modal-window-controls">
            <button type="button" class="btn-secondary minimize-btn btn-small" title="Minimize">
                <i class="fa-regular fa-window-minimize"></i>
            </button>
            <button type="button" class="btn-secondary btn-small modal-work-area-maximize" title="Maximize">
                <i class="fa-regular fa-window-maximize"></i>
            </button>
            <button type="button" class="btn-danger close-btn btn-small" id="closeTagWikiSearchModalBtn" title="Close">
                <i class="fa-regular fa-xmark-large"></i>
            </button>
        </div>
        <div class="modal-content tag-wiki-search-content dark">
            <div class="tag-wiki-panels-wrap">
                <div class="tag-wiki-search-body tag-wiki-split-pane-left">
                    <!-- Old results sidebar (tag-wiki-search-results-panel + list + toggles + overlay) removed.

                         into the display area (Google-style home + results list). Wiki content and split
                         panes continue to use the display areas. -->

                        <div id="tagWikiSearchDisplay" class="tag-wiki-display-content">
                            <div class="tag-wiki-empty-state">
                                <i class="fas fa-book-open"></i>
                                <p>Use the address bar or search to navigate (edtx://, wiki tags, or rdf:// docs).</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="tagWikiSearchSplitDivider" class="tag-wiki-split-divider hidden" aria-hidden="true">
                    <button type="button" id="tagWikiSearchSplitSwapBtn"
                        class="btn-secondary btn-small tag-wiki-split-swap-btn" title="Swap panels">
                        <i class="fas fa-arrow-right-arrow-left"></i>
                    </button>
                </div>
                <div id="tagWikiSearchRightPane" class="tag-wiki-split-pane tag-wiki-split-pane-right hidden">

                    </div>
                </div>
            </div>
        </div>
