<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>UI Lab — native kit</title>
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/dist/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/workspaces.css">
    <link rel="stylesheet" href="/css/custom-dropdown.css">
    <link rel="stylesheet" href="/css/desktop-shell.css">
    <link rel="stylesheet" href="/css/modal-dimensions.css">
    <link rel="stylesheet" href="/css/modal-theme-glass.css">
    <link rel="stylesheet" href="/css/modal-window-title-toolbar.css">
    <link rel="stylesheet" href="/css/custom-scrollbar.css">
</head>
<body>
<div id="uiLabModal" class="modal toolbar-visible resizeable-window tool-window active-window" data-window-min-width="520" data-window-min-height="360" style="width: 720px;">
    <div class="modal-window-title">
        <div class="modal-window-title-main">
            <i class="fas fa-flask icon-fa"></i>
            <span>UI Lab</span>
        </div>
        <div class="modal-window-title-toolbar">
            <button type="button" class="btn-secondary" title="Specimen toolbar">btn-secondary</button>
            <button type="button" class="btn-toggle" data-state="on" title="btn-toggle">btn-toggle</button>
        </div>
    </div>
    <div class="modal-focus-overlay"></div>
    <div class="modal-window-controls">
        <button type="button" class="btn-secondary minimize-btn btn-small" title="Minimize">
            <i class="fa-regular fa-window-minimize"></i>
        </button>
        <button type="button" class="btn-secondary btn-small modal-work-area-maximize" title="Maximize">
            <i class="fa-regular fa-window-maximize"></i>
        </button>
        <button type="button" class="btn-danger close-btn btn-small" title="Close">
            <i class="fa-regular fa-xmark-large"></i>
        </button>
    </div>
    <div class="modal-content modal-padding dark">
        <div class="form-section form-section-scroll">
            <p>Native package kit (v1 locked). Existing window classes only. Packages may not ship CSS.</p>
            <div class="form-row">
                <label>Specimen title</label>
                <input type="text" class="form-control" value="Example field" readonly>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-primary">btn-primary</button>
                <button type="button" class="btn-secondary">btn-secondary</button>
                <button type="button" class="btn-standard">btn-standard</button>
                <button type="button" class="btn-warning">btn-warning</button>
                <button type="button" class="btn-danger btn-small">btn-danger btn-small</button>
            </div>
            <div class="custom-dropdown">
                <button type="button" class="custom-dropdown-btn hover-show colored">custom-dropdown</button>
            </div>
            <p>Copy: <code>modal toolbar-visible resizeable-window</code>, <code>form-section</code>, <code>btn-primary</code>.</p>
            <p><a href="/melaton-mockups/">Back to mockup index</a></p>
        </div>
    </div>
</div>
</body>
</html>
