<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Packages — Run</title>
    <link rel="stylesheet" href="/dist/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/dsap-smf.css">
</head>
<body>
<div data-dsap="packages" class="dsap-root dsap-smf">
    <table class="dsap-smf-header" cellspacing="0" cellpadding="6" width="100%" border="0">
        <tr>
            <td class="dsap-smf-header-branch">
                <img src="/static_images/logo_icon.png" alt="Dreamscape" class="dsap-smf-header-logo">
                <span class="dsap-smf-header-branch-title">Packages</span>
            </td>
            <td class="dsap-smf-header-tool" align="right">Run</td>
        </tr>
    </table>
    <table class="dsap-smf-tabbar" cellspacing="0" cellpadding="3" border="1" width="100%">
        <tr>
            <td align="center" class="dsap-smf-tab"><a href="/melaton-mockups/packages-installed.html">Installed</a></td>
            <td align="center" class="dsap-smf-tab dsap-smf-tab-active active"><a href="/melaton-mockups/packages-run.html">Run</a></td>
            <td align="center" class="dsap-smf-tab"><a href="/melaton-mockups/packages-sources.html">Sources</a></td>
        </tr>
    </table>
    <div class="dsap-smf-contextbar">Portable .msaz stays in VFS. Run extracts to a temp cache slot. No Start row.</div>
    <div class="dsap-smf-section-hdr">Run a standalone archive</div>
    <div class="dsap-smf-statusbox">
        <span class="dsap-smf-status-message">Pick a VFS .msaz. Install copies it into .cache/packages like a .mapz.</span>
    </div>
    <div class="dsap-smf-toolbar">
        <label>VFS file
            <input type="text" class="dsap-smf-input" value="/Workspace/Inbox/melaton-ui-lab.msaz" readonly>
        </label>
        <button type="button" class="dsap-smf-btn dsap-smf-btn-small">Browse</button>
        <button type="button" class="dsap-smf-btn dsap-smf-btn-small dsap-smf-btn-primary">Run once</button>
        <button type="button" class="dsap-smf-btn dsap-smf-btn-small">Install</button>
    </div>
    <table class="dsap-smf-stats" cellspacing="0" cellpadding="3" width="100%" border="1">
        <tr>
            <td align="center"><span class="dsap-smf-stat-label">Detected type</span><br><span class="dsap-smf-stat-value">native</span></td>
            <td align="center"><span class="dsap-smf-stat-label">format</span><br><span class="dsap-smf-stat-value">msaz</span></td>
            <td align="center"><span class="dsap-smf-stat-label">cssPolicy</span><br><span class="dsap-smf-stat-value">locked</span></td>
        </tr>
    </table>
    <p><a href="/melaton-mockups/" class="dsap-smf-home-link">Back to mockup index</a></p>
</div>
</body>
</html>
