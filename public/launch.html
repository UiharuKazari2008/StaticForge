<head>
    <title>Dreamscape</title>
    <meta charset="UTF-8">

        content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Launch-only design mode (this file only): / → ?design=1; validation paused; HUD presets = launch DOM only -->
    <script>
        var dreamscapeDesignModeActive = false;

        (function dreamscapeLaunchDesignBoot() {
            var STORAGE_KEY = 'dreamscapeDesignMode';

            function readFromUrl() {
                try {
                    return new URLSearchParams(location.search || '').get('design') === '1';
                } catch (e) {
                    return false;
                }
            }

            function readFlag() {
                try {
                    if (sessionStorage.getItem(STORAGE_KEY) === '1' || readFromUrl()) {
                        dreamscapeDesignModeActive = true;
                        sessionStorage.setItem(STORAGE_KEY, '1');
                    }
                } catch (e) { /* ignore */ }
            }

            function dreamscapeLaunchDesignContinueToApp() {
                try {
                    sessionStorage.removeItem(STORAGE_KEY);
                } catch (e) { /* ignore */ }
                try {
                    sessionStorage.setItem('dreamscapeLaunchHandoff', '1');
                } catch (e2) { /* ignore */ }
                location.replace('/app');
            }

            function dreamscapeLaunchDesignExit() {
                try {
                    sessionStorage.removeItem(STORAGE_KEY);
                } catch (e) { /* ignore */ }
                try {
                    var u = new URL(location.href);
                    u.searchParams.delete('design');
                    var next = u.pathname + (u.search || '') + (u.hash || '');
                    location.replace(next || '/launch');
                } catch (e2) {
                    location.replace('/launch');
                }
            }

            function dreamscapeLaunchDesignApplyPreset(preset) {
                var loading = document.getElementById('loading');
                var errEl = document.getElementById('errorMessage');
                var verEl = document.getElementById('versionWarning');
                var errText = document.getElementById('errorText');
                var verMsg = document.getElementById('versionMessage');
                if (!loading || !errEl || !verEl) {
                    return;
                }
                if (preset === 'splash') {
                    errEl.classList.add('hidden');
                    verEl.classList.add('hidden');
                    loading.classList.remove('hidden');
                    var rescueSplash = document.getElementById('rescueButton');
                    if (rescueSplash) {
                        rescueSplash.classList.add('hidden');
                    }
                    return;
                }
                if (preset === 'error') {
                    loading.classList.add('hidden');
                    verEl.classList.add('hidden');
                    errEl.classList.remove('hidden');
                    var rescueOff = document.getElementById('rescueButton');
                    if (rescueOff) {
                        rescueOff.classList.add('hidden');
                    }
                    if (errText) {
                        errText.textContent = 'Example error copy (design mode — no network)';
                    }
                    return;
                }
                if (preset === 'errorRescue') {
                    loading.classList.add('hidden');
                    verEl.classList.add('hidden');
                    errEl.classList.remove('hidden');
                    if (errText) {
                        errText.textContent = 'Example error with rescue (design mode)';
                    }
                    var rescueBtn = document.getElementById('rescueButton');
                    if (rescueBtn) {
                        rescueBtn.classList.remove('hidden');
                    }
                    return;
                }
                if (preset === 'version') {
                    loading.classList.add('hidden');
                    errEl.classList.add('hidden');
                    verEl.classList.remove('hidden');
                    var rescueVer = document.getElementById('rescueButton');
                    if (rescueVer) {
                        rescueVer.classList.add('hidden');
                    }
                    if (verMsg) {
                        verMsg.textContent = 'Example version mismatch copy (design mode)';
                    }
                    return;
                }
                if (preset === 'reset') {
                    dreamscapeLaunchDesignApplyPreset('splash');
                    var rescueBtn2 = document.getElementById('rescueButton');
                    if (rescueBtn2) {
                        rescueBtn2.classList.add('hidden');
                    }
                }
            }

            function dreamscapeLaunchDesignMountHud() {
                if (document.getElementById('dreamscapeLaunchDesignHud')) {
                    return;
                }
                var wrap = document.createElement('div');
                wrap.id = 'dreamscapeLaunchDesignHud';
                wrap.innerHTML =
                    '<div class="dreamscape-launch-design-hud-inner">' +
                    '<div class="dreamscape-launch-design-hud-title">Design mode (launch)</div>' +
                    '<p class="dreamscape-launch-design-hud-note">Validation is paused. Toggles only affect this page. App is unchanged.</p>' +
                    '<div class="dreamscape-launch-design-presets">' +
                    '<button type="button" class="dreamscape-launch-design-btn dreamscape-launch-design-btn-muted" data-launch-preset="splash">View: splash</button>' +
                    '<button type="button" class="dreamscape-launch-design-btn dreamscape-launch-design-btn-muted" data-launch-preset="error">View: error</button>' +
                    '<button type="button" class="dreamscape-launch-design-btn dreamscape-launch-design-btn-muted" data-launch-preset="errorRescue">View: error + rescue</button>' +
                    '<button type="button" class="dreamscape-launch-design-btn dreamscape-launch-design-btn-muted" data-launch-preset="version">View: version warning</button>' +
                    '<button type="button" class="dreamscape-launch-design-btn dreamscape-launch-design-btn-muted" data-launch-preset="reset">Reset view</button>' +
                    '</div>' +
                    '<div class="dreamscape-launch-design-hud-actions">' +
                    '<button type="button" class="dreamscape-launch-design-btn dreamscape-launch-design-btn-primary" id="dreamscapeLaunchDesignGoBtn">Continue to app</button>' +
                    '<button type="button" class="dreamscape-launch-design-btn dreamscape-launch-design-btn-muted" id="dreamscapeLaunchDesignExitBtn">Exit design mode</button>' +
                    '</div></div>';
                document.body.appendChild(wrap);
                document.getElementById('dreamscapeLaunchDesignGoBtn').addEventListener('click', dreamscapeLaunchDesignContinueToApp);
                document.getElementById('dreamscapeLaunchDesignExitBtn').addEventListener('click', dreamscapeLaunchDesignExit);
                wrap.addEventListener('click', function (ev) {
                    var btn = ev.target && ev.target.closest ? ev.target.closest('[data-launch-preset]') : null;
                    if (btn) {
                        dreamscapeLaunchDesignApplyPreset(btn.getAttribute('data-launch-preset') || 'splash');
                    }
                });
            }

            readFlag();
            try {
                document.documentElement.classList.toggle('dreamscape-design-mode', dreamscapeDesignModeActive);
            } catch (e) { /* ignore */ }

            function dreamscapeLaunchDesignSlash(ev) {
                if (dreamscapeDesignModeActive) {
                    return;
                }
                if (ev.repeat) {
                    return;
                }
                var ok = ev.code === 'Slash' || ev.code === 'NumpadDivide' || ev.key === '/';
                if (!ok) {
                    return;
                }
                try {
                    sessionStorage.setItem(STORAGE_KEY, '1');
                } catch (x) { /* ignore */ }
                ev.preventDefault();
                ev.stopImmediatePropagation();
                removeEventListener('keydown', dreamscapeLaunchDesignSlash, true);
                try {
                    var u = new URL(location.href);
                    u.searchParams.set('design', '1');
                    location.replace(u.pathname + u.search + (u.hash || ''));
                } catch (e2) {
                    location.replace('/launch?design=1');
                }
            }

            if (!dreamscapeDesignModeActive) {
                addEventListener('keydown', dreamscapeLaunchDesignSlash, true);
            }

            if (dreamscapeDesignModeActive) {
                function onDomReady() {
                    dreamscapeLaunchDesignMountHud();
                }
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', onDomReady);
                } else {
                    onDomReady();
                }
            }
        })();
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Window Controls Overlay API Variables */
        :root {
            --titlebar-area-x: env(titlebar-area-x, 0);
            --titlebar-area-y: env(titlebar-area-y, 0);
            --titlebar-area-width: env(titlebar-area-width, 100%);
            --titlebar-area-height: env(titlebar-area-height, 33px);
        }

        @font-face {
            font-family: 'MozillaHeadline';
            src: url('/dist/fonts/MozillaHeadline-VariableFont_wdth,wght.ttf') format('truetype');
            font-weight: 100 900;
            font-stretch: 75% 125%;
        }

        body {
            font-family: 'MozillaHeadline', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: white;
            overflow: hidden;
            font-variation-settings: "wght" 400;
            font-weight: 400;
            overscroll-behavior: none;
            height: 100vh;
            width: 100vw;
        }

        /* Window Controls Overlay API - Titlebar Grab Area */
        #titlebar-grab-area {
            position: fixed;
            top: 0;
            left: var(--titlebar-area-x);
            width: var(--titlebar-area-width);
            height: var(--titlebar-area-height);
            z-index: 1000;
            background: transparent;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Center grab area - the actual draggable region */
        #titlebar-grab-center {
            height: 100%;
            background: transparent;
            pointer-events: auto;
            -webkit-app-region: drag;
            app-region: drag;
            cursor: grab;
            flex: 1 1 auto;
            min-width: 50px;
        }

        #titlebar-grab-center:active {
            cursor: grabbing;
        }

        /* Titlebar clickable areas */
        #titlebar-null-left,
        #titlebar-null-right {
            height: 100%;
            background: transparent;
            pointer-events: auto;
            -webkit-app-region: no-drag;
            app-region: no-drag;
            cursor: default;
            flex: 0 0 auto;
            min-width: 0;
        }

        /* Enable and grow left area */
        #titlebar-null-left.enabled {
            flex: 1 1 auto;
            min-width: 20px;
        }

        /* Enable and grow right area */
        #titlebar-null-right.enabled {
            flex: 1 1 auto;
            min-width: 20px;
        }

        /* Ensure interactive elements in titlebar are not draggable */
        #titlebar-grab-area button,
        #titlebar-grab-area input,
        #titlebar-grab-area select,
        #titlebar-grab-area textarea,
        #titlebar-grab-area a,
        #titlebar-grab-area [role="button"] {
            -webkit-app-region: no-drag;
            app-region: no-drag;
            cursor: default;
        }

        .launch-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            view-transition-name: launch-splash;
        }

        .launch-content {
            text-align: center;
            z-index: 10;
            background: rgb(38 38 38 / 57%);
            padding: 2rem;
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            justify-content: center;
            align-items: center;
            display: flex;
            flex-direction: column;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            background-image: url('/static_images/logo_icon.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .app-name {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }



        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 1rem 0;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #f1b263;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error-message {
            color: #ef4444;
            margin: 1rem 0;
            padding: 1rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 0.5rem;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            justify-content: center;
        }

        .retry-button,
        .continue-button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .retry-button:disabled,
        .continue-button:disabled {
            background: #6b7280;
            cursor: not-allowed;
        }

        .rescue-button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .rescue-button:hover {
            background: #dc2626;
        }

        .version-warning {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0) + env(titlebar-area-height, 0));
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .warning-content {
            background: rgb(38 38 38 / 90%);
            padding: 2rem;
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 500px;
            margin: 1rem;
        }

        .warning-content h3 {
            color: #fbbf24;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .warning-content p {
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .hidden {
            display: none;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .launch-content {
                margin: 1rem;
                padding: 1.5rem;
            }

            .logo {
                width: 60px;
                height: 60px;
            }

            .app-name {
                font-size: 1.25rem;
            }
        }

        /* Launch-only design mode HUD (see inline script in <head>) */
        html.dreamscape-design-mode #dreamscapeLaunchDesignHud {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 100001;
            max-width: min(300px, calc(100vw - 24px));
            font-family: system-ui, sans-serif;
            font-size: 12px;
            color: #e5e7eb;
            pointer-events: auto;
        }

        html.dreamscape-design-mode .dreamscape-launch-design-hud-inner {
            background: rgba(17, 24, 39, 0.96);
            border: 1px solid rgba(75, 85, 99, 0.9);
            border-radius: 10px;
            padding: 10px 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        html.dreamscape-design-mode .dreamscape-launch-design-hud-title {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
        }

        html.dreamscape-design-mode .dreamscape-launch-design-hud-note {
            margin: 0 0 10px;
            line-height: 1.35;
            color: #9ca3af;
        }

        html.dreamscape-design-mode .dreamscape-launch-design-hud-note code {
            font-size: 11px;
            color: #d1d5db;
        }

        html.dreamscape-design-mode .dreamscape-launch-design-presets {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }

        html.dreamscape-design-mode .dreamscape-launch-design-hud-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        html.dreamscape-design-mode .dreamscape-launch-design-btn {
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        html.dreamscape-design-mode .dreamscape-launch-design-btn-primary {
            background: #6366f1;
            color: #fff;
        }

        html.dreamscape-design-mode .dreamscape-launch-design-btn-primary:hover {
            background: #4f46e5;
        }

        html.dreamscape-design-mode .dreamscape-launch-design-btn-muted {
            background: #374151;
            color: #e5e7eb;
            border: 1px solid #4b5563;
        }

        html.dreamscape-design-mode .dreamscape-launch-design-btn-muted:hover {
            background: #4b5563;
        }
    </style>
</head>

<body>
    <!-- Window Controls Overlay API - Titlebar Grab Area -->
    <div id="titlebar-grab-area">
        <div id="titlebar-null-left"></div>
        <div id="titlebar-grab-center"></div>
        <div id="titlebar-null-right"></div>
    </div>

    <div class="launch-container">
        <div class="launch-content">
            <div class="logo"></div>
            <div class="app-name">Dreamscape</div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>

            <div class="error-message hidden" id="errorMessage">
                <div id="errorText"></div>
                <div class="button-group">
                    <button class="retry-button" id="retryButton" onclick="retryValidation()">Retry</button>
                    <button class="rescue-button hidden" id="rescueButton" onclick="performRescue()">Rescue</button>
                </div>
            </div>

            <div class="version-warning hidden" id="versionWarning">
                <div class="warning-content">
                    <h3>Version Mismatch Detected</h3>
                    <p id="versionMessage"></p>
                    <div class="button-group">
                        <button class="continue-button" onclick="continueAnyway()">Continue Anyway</button>
                        <button class="rescue-button" onclick="performRescue()">Rescue & Update</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let validationInProgress = false;
        /** Earliest time normal validation may run (splash visible); paired with design-mode inline script in <head> */
        var dreamscapeLaunchSplashHoldUntilMs = 0;

        async function checkOnlineStatus() {
            return navigator.onLine;
        }

        async function checkServerAccessibility() {
            try {
                const response = await fetch('/static_images/icon-32x32.png', {
                    method: 'HEAD',
                    cache: 'no-cache'
                });
                return response.ok;
            } catch (error) {
                return false;
            }
        }

        async function checkServerReadiness() {
            try {
                const response = await fetch('/status', {
                    method: 'OPTIONS',
                    cache: 'no-cache'
                });

                if (response.ok) {
                    const data = await response.json();
                    return {
                        isReady: data.isReady,
                        stage: data.stage,
                        stageMessage: data.stageMessage,
                        uptime: data.uptime
                    };
                } else {
                    return null;
                }
            } catch (error) {
                return null;
            }
        }

        let serverReadinessInterval = null;
        let serverReadinessAttempts = 0;
        const maxReadinessAttempts = 20; // 20 attempts = 10 minutes (30s * 20)

        async function pollServerReadiness() {
            if (typeof dreamscapeDesignModeActive !== 'undefined' && dreamscapeDesignModeActive) {
                return;
            }
            const readiness = await checkServerReadiness();

            if (readiness === null) {
                // Server not responding at all
                serverReadinessAttempts++;
                if (serverReadinessAttempts >= maxReadinessAttempts) {
                    clearInterval(serverReadinessInterval);
                    showError('Server is not responding after 10 minutes', true);
                    return;
                }
                showError(`Server not responding (attempt ${serverReadinessAttempts}/${maxReadinessAttempts})`, true);
                return;
            }

            if (readiness.isReady) {
                // Server is ready, proceed with normal validation
                clearInterval(serverReadinessInterval);
                if (typeof dreamscapeDesignModeActive !== 'undefined' && dreamscapeDesignModeActive) {
                    return;
                }
                showError('Server is ready, validating...');
                setTimeout(performValidation, 1000);
                return;
            }

            // Server is initializing, show current stage
            const uptimeSeconds = Math.floor(readiness.uptime / 1000);
            showError(`${readiness.stageMessage} (${uptimeSeconds}s)`, true);
        }

        function startServerReadinessPolling() {
            if (typeof dreamscapeDesignModeActive !== 'undefined' && dreamscapeDesignModeActive) {
                return;
            }
            if (serverReadinessInterval) {
                clearInterval(serverReadinessInterval);
            }

            serverReadinessAttempts = 0;
            showError('Checking server status...');

            // Start polling every 30 seconds
            serverReadinessInterval = setInterval(pollServerReadiness, 30000);

            // Also check immediately
            pollServerReadiness();
        }

        async function checkSessionValidity() {
            try {
                const response = await fetch('/app', {
                    method: 'OPTIONS',
                    cache: 'no-cache'
                });

                if (response.ok) {
                    const data = await response.json();

                    // Check version compatibility
                    const clientVersion = '1.0.2'; // Current client version
                    if (data.serverVersion && data.serverVersion !== clientVersion) {
                        // Version mismatch - show warning
                        showVersionWarning({
                            serverVersion: data.serverVersion,
                            clientVersion: clientVersion,
                            message: data.versionMessage || 'A new version is available. Some features may not work correctly.'
                        });
                        return null; // Indicate version check needed
                    }

                    return true; // Session valid and version compatible
                } else {
                    return false; // Session invalid
                }
            } catch (error) {
                return false;
            }
        }



        function showError(message, showRescue = false) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('errorMessage').classList.remove('hidden');
            document.getElementById('errorText').textContent = message;

            if (showRescue) {
                document.getElementById('rescueButton').classList.remove('hidden');
            } else {
                document.getElementById('rescueButton').classList.add('hidden');
            }
        }

        function hideError() {
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
        }

        function redirectToApp() {
            if (typeof dreamscapeDesignModeActive !== 'undefined' && dreamscapeDesignModeActive) {
                return;
            }
            try {
                sessionStorage.setItem('dreamscapeLaunchHandoff', '1');
            } catch (e) { /* ignore */ }
            var go = function () {
                window.location.replace('/app');
            };
            if (document.startViewTransition) {
                document.startViewTransition(go);
            } else {
                go();
            }
        }

        function redirectToHome() {
            if (typeof dreamscapeDesignModeActive !== 'undefined' && dreamscapeDesignModeActive) {
                return;
            }
            // Use replace to avoid back button issues and prevent white flash
            window.location.replace('/');
        }

        async function performValidation() {
            if (typeof dreamscapeDesignModeActive !== 'undefined' && dreamscapeDesignModeActive) {
                return;
            }
            if (dreamscapeLaunchSplashHoldUntilMs > 0) {
                var splashRem = dreamscapeLaunchSplashHoldUntilMs - Date.now();
                if (splashRem > 0) {
                    await new Promise(function (resolve) {
                        setTimeout(resolve, splashRem);
                    });
                }
            }
            if (typeof dreamscapeDesignModeActive !== 'undefined' && dreamscapeDesignModeActive) {
                return;
            }

            if (validationInProgress) return;
            validationInProgress = true;

            hideError();

            // Step 1: Check online status
            if (!await checkOnlineStatus()) {
                showError('No internet connection');
                validationInProgress = false;
                return;
            }

            // Step 2: Check server readiness first
            const readiness = await checkServerReadiness();
            if (readiness === null) {
                // Server not responding, start polling
                validationInProgress = false;
                startServerReadinessPolling();
                return;
            }

            if (!readiness.isReady) {
                // Server is initializing, start polling
                validationInProgress = false;
                startServerReadinessPolling();
                return;
            }

            // Step 3: Check server accessibility (server is ready)
            if (!await checkServerAccessibility()) {
                showError('Unable to connect to server', true); // Show rescue button
                validationInProgress = false;
                return;
            }

            // Step 4: Check session validity and version compatibility
            const sessionResult = await checkSessionValidity();
            if (sessionResult === null) {
                // Version mismatch - warning already shown
                validationInProgress = false;
                return;
            } else if (sessionResult) {
                // Session valid and version compatible
                setTimeout(redirectToApp, 500);
            } else {
                // Session invalid
                setTimeout(redirectToHome, 500);
            }

            validationInProgress = false;
        }

        function retryValidation() {
            performValidation();
        }

        async function performRescue() {
            try {
                // Clear all caches
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(
                        cacheNames.map(cacheName => caches.delete(cacheName))
                    );
                }

                // Unregister service worker
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(
                        registrations.map(registration => registration.unregister())
                    );
                }

                // Clear localStorage and sessionStorage
                localStorage.clear();
                sessionStorage.clear();

                // Reload the page
                window.location.reload();
            } catch (error) {
                console.error('Rescue failed:', error);
                showError('Rescue failed. Please try refreshing the page manually.');
            }
        }



        function showVersionWarning(versionData) {
            document.getElementById('versionMessage').textContent = versionData.message;
            document.getElementById('versionWarning').classList.remove('hidden');
        }

        function continueAnyway() {
            document.getElementById('versionWarning').classList.add('hidden');
            // Continue with normal flow
            performValidation();
        }

        // Start validation when page loads (mandatory 1s splash hold so / can be caught; design mode skips validation)
        document.addEventListener('DOMContentLoaded', () => {
            dreamscapeLaunchSplashHoldUntilMs = Date.now() + 1000;
            if (typeof dreamscapeDesignModeActive !== 'undefined' && dreamscapeDesignModeActive) {
                if (serverReadinessInterval) {
                    clearInterval(serverReadinessInterval);
                    serverReadinessInterval = null;
                }
                return;
            }
            performValidation();
        });

        // Handle online/offline events
        window.addEventListener('online', () => {
            if (typeof dreamscapeDesignModeActive !== 'undefined' && dreamscapeDesignModeActive) {
                return;
            }
            if (document.getElementById('errorMessage').classList.contains('hidden')) {
                performValidation();
            }
        });

        window.addEventListener('offline', () => {
            showError('Connection lost. Please check your network and try again.');
        });
    </script>
</body>

</html>
