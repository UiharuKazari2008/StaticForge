<script>
var percentage;
var bars = Array();
var percentages;
var graphs;
var updateCount = 3;
var totalCpus;
System.Gadget.settingsUI = "Prefs.html";
System.Gadget.onSettingsClosed = updateSkin;
	
function updateSkin() {
	var newImage;
	var skin = System.Gadget.Settings.read("skinColor");
	if(skin == '') {
		System.Gadget.Settings.write("skinColor", "blue");
		skin = "blue";
	}

     	for (i=0;i<graphs.length;i++){
		if(skin == "fire")
			graphs[i].style.background = "url(firesmall.png)";
		else
			graphs[i].style.background = "url(graph_horizontalbar1_"+skin+".png)";
	}
	ramGraph.style.background = "url(graph_horizontalbar1_"+skin+".png)";
}

function calculateUsage (total, available) {
	if(total <= 0)
		return 0;
	if(available > total)
		return 0;
	
	var usage = Math.round(100 - (available / total * 100));	
	if(usage <= 0)
		return 0;
	if(usage > 100)
		return 100;
	
	return usage;
}

function getFreeRam(total) {
	suffixes = Array("MB", "GB", "TB");
	var suffix = 0;
	while(total > 1000) {
		total = total / 1024;
		suffix++;
	}
	if(suffix != 0)
		total = total.toFixed(2);


	return total + "<span style='font-size:9px;font-weight:bold;font-family:Arial'>" + suffixes[suffix] + "</span>";
}

function update(){
     var totalUsage = 0;
	var text = '';
    	for (var i=0;i<totalCpus;i++){
		thisCpu = System.Machine.CPUs.item(i).usagePercentage;
		totalUsage += thisCpu 
	    	theUsage = thisCpu 
    		graphs[i].style.width = verifyUsage(Math.round(thisCpu * 0.72));
		percentages[i].innerText = verifyUsage(Math.round(thisCpu * 0.72)) + "%";
	}
	if(updateCount == 3) {
		total = System.Machine.totalMemory;
		available = System.Machine.availableMemory;
		memUsage = calculateUsage(total,available);
    
		ramGraph.style.width = verifyUsage(Math.round(memUsage * 1.02));
	
		freeRam.innerHTML = getFreeRam(available);
		updateCount = 0;
	} else {
		updateCount++;
	}
	setTimeout("update()",1000);
}


function setUpGadget() {
	percentages = Array(percentage1, percentage2, percentage3, percentage4, percentage5, percentage6, percentage7, percentage8, percentage9, percentage10, percentage11, percentage12, percentage13, percentage14, percentage15, percentage16);
	graphs = Array(graph1, graph2, graph3, graph4, graph5, graph6, graph7, graph8, graph9, graph10, graph11, graph12, graph13, graph14, graph15, graph16);
	graphbgs = Array(graphbg1, graphbg2, graphbg3, graphbg4, graphbg5, graphbg6, graphbg7, graphbg8, graphbg9, graphbg10, graphbg11, graphbg12, graphbg13, graphbg14, graphbg15, graphbg16);

	totalCpus = System.Machine.CPUs.count;
	if(totalCpus > 16)
		totalCpus = 16;
	theBody.style.background = "url(" + totalCpus + ".png)";
	theBody.style.height = 51 + (totalCpus * 10);
	for(x=0;x<totalCpus;x++){
		graphs[x].style.display = "block";
		graphbgs[x].style.display = "block";
		percentages[x].style.display = "block";
	}

	freeRam.style.top = 14 + (totalCpus * 10)
	freeRamTitle.style.top = 14 + (totalCpus * 10)
	freeRambackground.style.top = 29 + (totalCpus * 10)
	ramGraph.style.top = 29 + (totalCpus * 10);

	updateSkin();
	update();
}

function verifyUsage(usage) {
    if(usage == null)
        return 0;
  
    if(usage < 0)
        return 0;

    if(usage < 10)
        return usage;

    if(usage > 100)
		return 100;

    return usage;
}

</script>
