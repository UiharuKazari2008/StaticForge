<html>
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; form-action 'none'; base-uri 'self'"><script src="/scripts/comp/sidebar-gadgets/gadgetShim.js"></script>
<script>

var xCells = 13;
var yCells = 13;
var seedCells = 50;
var queueSeed = false;

function loaded()
{
	var xWithPadding = xCells + 2;
	var yWithPadding = yCells + 2;

	var currentBoard = new Array(xWithPadding);
	var nextBoard = new Array(xWithPadding);

	for (var i = 0; i < xWithPadding; i++)
	{
		currentBoard[i] = new Array(yWithPadding);
		nextBoard[i] = new Array(yWithPadding);

		for (var j = 0; j < yWithPadding; j++)
		{
			currentBoard[i][j] = 0;
			nextBoard[i][j] = 0;
		}
	}
	for (var i = 0; i < xCells; i++)
	{
		for (var j = 0; j < yCells; j++)
		{
			var div = document.createElement("div");
			div.id = "cell-" + i + "-" + j;
			div.style.width = 10;
			div.style.height = 10;
			div.style.position = "absolute";
			div.style.top = j * 10;
			div.style.left = i * 10;
			div.style.backgroundColor = "rgb(" + Math.floor((i * 256) / xCells) + ", " + Math.floor((j * 256) / yCells) + ", 0)";
			document.body.appendChild(div);
		}
	}
	seed(currentBoard);
	step(currentBoard, nextBoard);
}

function seed(board)
{
	for (var i = 0; i < seedCells; i++)
	{
		var x = Math.floor(Math.random() * xCells);
		var y = Math.floor(Math.random() * yCells);
		var id = "cell-" + x + "-" + y;

		var cell = document.getElementById(id);
		cell.style.backgroundImage = "url(bug.png)";

		board[x + 1][y + 1] = 1;
	}
}

function step(currentBoard, nextBoard)
{
	if (queueSeed)
	{
		queueSeed = false;
		seed(currentBoard);
	}
	for (var i = 0; i < xCells; i++)
	{
		currentBoard[i + 1][0] = currentBoard[i + 1][yCells];
		currentBoard[i + 1][yCells + 1] = currentBoard[i + 1][1];
	}
	for (var i = 0; i < yCells; i++)
	{
		currentBoard[0][i + 1] = currentBoard[xCells][i + 1];
		currentBoard[xCells + 1][i + 1] = currentBoard[1][i + 1];
	}
	currentBoard[0][0] = currentBoard[xCells][yCells];
	currentBoard[0][yCells + 1] = currentBoard[xCells][1];
	currentBoard[xCells + 1][0] = currentBoard[1][yCells];
	currentBoard[xCells + 1][yCells + 1] = currentBoard[1][1];

	for (var i = 1; i <= xCells; i++)
	{
		for (var j = 1; j <= yCells; j++)
		{
			neighbors = 0;
			neighbors += currentBoard[i - 1][j - 1];
			neighbors += currentBoard[i - 1][j];
			neighbors += currentBoard[i - 1][j + 1];
			neighbors += currentBoard[i][j - 1];
			neighbors += currentBoard[i][j + 1];
			neighbors += currentBoard[i + 1][j - 1];
			neighbors += currentBoard[i + 1][j];
			neighbors += currentBoard[i + 1][j + 1];

			var x = i - 1;
			var y = j - 1;
			var id = "cell-" + x + "-" + y;
			var cell = document.getElementById(id);

			if (neighbors < 2)
			{
				nextBoard[i][j] = 0;
				cell.style.backgroundImage = "";
			}
			else if (neighbors > 3)
			{
				nextBoard[i][j] = 0;
				cell.style.backgroundImage = "";
			}
			else if (neighbors == 3)
			{
				nextBoard[i][j] = 1;
				cell.style.backgroundImage = "url(bug.png)";
			}
			else
			{
				nextBoard[i][j] = currentBoard[i][j];
				if (nextBoard[i][j] == 1)
				{
					cell.style.backgroundImage = "url(bug.png)";
				}
				else // nextBoard[i][j] == 0
				{
					cell.style.backgroundImage = "";
				}
			}
		}
	}
	window.setTimeout(function () {step(nextBoard, currentBoard);}, 1000);
}

</script>
</head>
<body style="height:130;width:130" onload="loaded()" onclick="javascript:queueSeed = true;">
</body>
</html>
