<script>



function init(){
setInterval('tick()',1000);
setTimeout('document.getElementById(\'strapText\').innerHTML = strapText;',1000);
setTimeout('loadSettings()',1000);
}

function tick(){
document.getElementById('counterText').style.color = textColour;
document.getElementById('strapText').style.color = textColour;
document.getElementById('counterText').style.fontSize = mainTextSize;
document.getElementById('strapText').style.fontSize  = strapTextSize;
document.getElementById('counterText').style.fontFamily = fontFace;
document.getElementById('strapText').style.fontFamily  = fontFace;
ele = document.getElementById('counterText');
thisDate = new Date;
differenceUTC = Date.parse(countDate) - Date.parse(thisDate);
secsleft = differenceUTC/1000;
if(secsleft >= 0){
ele.innerHTML = formatDate(secsleft,view);
} else {
ele.innerHTML = "Finished!";
}
//alert("helo: " + secsleft);
}


function formatDate(dateSeconds,view){

returnText = "";

if(view == "smart2"){
// Days
days = Math.floor(dateSeconds / (60 * 60 * 24));
dateSeconds = dateSeconds - (days * (60 * 60 * 24));

// Hours
hours = Math.floor(dateSeconds / (60 * 60));
dateSeconds = dateSeconds - (hours * (60 * 60));

// Minutes
minutes = Math.floor(dateSeconds / 60);
dateSeconds = dateSeconds - (minutes * 60);

//Days
if(days > 0){
returnText += days + "d ";
returnText += (hours+1) + "h";
} else if(hours > 0){
//Hours
returnText += hours + "h ";
returnText += (minutes+1) + "m";
} else if(minutes > 0){
//Minutes
returnText += minutes + "m ";
returnText += (dateSeconds + 1) + "s";
} else {
// Seconds
returnText += (dateSeconds+1) + " Seconds";
}
} else if(view == "smart1"){
// Days
days = Math.floor(dateSeconds / (60 * 60 * 24));
dateSeconds = dateSeconds - (days * (60 * 60 * 24));

// Hours
hours = Math.floor(dateSeconds / (60 * 60));
dateSeconds = dateSeconds - (hours * (60 * 60));

// Minutes
minutes = Math.floor(dateSeconds / 60);
dateSeconds = dateSeconds - (minutes * 60);

//Days
if(days > 0){
returnText += (days + 1) + " Days ";
} else if(hours > 0){
//Hours
returnText += (hours + 1) + " Hours";
} else if(minutes > 0){
//Minutes
returnText += (minutes + 1) + " Minutes";
} else {
// Seconds
returnText += (dateSeconds + 1) + " Seconds";
}
} else if(view == "timer"){
// Days
days = Math.floor(dateSeconds / (60 * 60 * 24));
dateSeconds = dateSeconds - (days * (60 * 60 * 24));

// Hours
hours = Math.floor(dateSeconds / (60 * 60));
dateSeconds = dateSeconds - (hours * (60 * 60));

// Minutes
minutes = Math.floor(dateSeconds / 60);
dateSeconds = dateSeconds - (minutes * 60);

returnText += PadDigits(days,2) + ":";
returnText += PadDigits(hours,2) + ":";
returnText += PadDigits(minutes,2) + ":";
returnText += PadDigits(dateSeconds,2);
} else if(view == "all"){
// Days
days = Math.floor(dateSeconds / (60 * 60 * 24));
dateSeconds = dateSeconds - (days * (60 * 60 * 24));
returnText += days + "d ";
// Hours
hours = Math.floor(dateSeconds / (60 * 60));
dateSeconds = dateSeconds - (hours * (60 * 60));
returnText += PadDigits(hours,2) + "h ";

// Minutes
minutes = Math.floor(dateSeconds / 60);
dateSeconds = dateSeconds - (minutes * 60);
returnText += PadDigits(minutes,2) + "m ";


// Seconds
returnText += PadDigits(dateSeconds,2) + "s";
} else if(view == "weeks"){
// Days
days = Math.floor(dateSeconds / (60 * 60 * 24));
dateSeconds = dateSeconds - (days * (60 * 60 * 24));
weeks = Math.floor(days / 7);
returnText += (weeks + 1);
if(weeks == 0){
returnText = "> " + returnText + " Week";
} else if((weeks+1) == 1){
returnText += " Week";
} else {
returnText += " Weeks";
 }

} else if(view == "days"){
// Days
days = Math.floor(dateSeconds / (60 * 60 * 24));
dateSeconds = dateSeconds - (days * (60 * 60 * 24));
returnText += (days + 1);
if(days == 0){
returnText = "> " + returnText + " Day";
} else if((days+1) == 1){
returnText += " Day";
} else {
returnText += " Days";
 }

} else if(view == "hours"){
// Hours
hours = Math.floor(dateSeconds / (60 * 60));
dateSeconds = dateSeconds - (hours * (60 * 60));
returnText += (hours+1);
if(hours == 0){
returnText = "> " + returnText + " Hour";
} else if((hours+1) == 1){
returnText += " Hour";
} else {
returnText += " Hours";
 }
} else if(view == "minutes"){
minutes = Math.floor(dateSeconds / 60);
dateSeconds = dateSeconds - (minutes * 60);
returnText += (minutes+1);
if(weeks == 0){
returnText = "> " + returnText + " Minute";
} else if((minutes+1) == 1){
returnText += " Min";
} else {
returnText += " Mins";
 }
}
return returnText;
}

function PadDigits(n, totalDigits) 
    { 
        n = n.toString(); 
        var pd = ''; 
        if (totalDigits > n.length) 
        { 
            for (i=0; i < (totalDigits-n.length); i++) 
            { 
                pd += '0'; 
            } 
        } 
        return pd + n.toString(); 
    }
