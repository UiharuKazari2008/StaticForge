<script>

var g_fResetGame = false;

function init() 
{
}

System.Gadget.onSettingsClosing = SettingsClosing;

function SettingsClosing(event)
{
	if (event.closeAction == event.Action.commit) {
		System.Gadget.Settings.write("ResetGame", "true");
	}
	else
	{
		System.Gadget.Settings.write("ResetGame", "false");
	}
	
	event.cancel = false;
}

</script>
