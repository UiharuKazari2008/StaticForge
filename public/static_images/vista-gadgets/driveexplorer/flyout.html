<html>
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; form-action 'none'; base-uri 'self'"><script src="/scripts/comp/sidebar-gadgets/gadgetShim.js"></script>
<title>Drive Explorer</title>
<meta http-equiv="MSThemeCompatible" content="yes" />

<style type="text/css">

body
{
    margin: 0px;
    width: 300px;
    height: 200px;
}

#driveExplorerContents
{
    position: absolute;
    left: 0px;
    top: 0px;
}

</style>
<script src="control/framework.js" language="javascript" type="text/javascript"></script>
<script src="js/driveExplorer.js" language="javascript" type="text/javascript"></script>
<script language="javascript" type="text/javascript">

__System.UseXMLHTTP = false;

__System.Import("System.Controls.UI.ScrollBar");

var driveExplorerScrollBar;

function loadGadget()
{
    var filePath = System.Gadget.Settings.read("fileExplorerPath");
    
    buildFolderContents(filePath);
    
    driveExplorerScrollBar = new ScrollBar("control/resources/ui/scrollbar/small/");
    driveExplorerScrollBar.PageID = "driveExplorerContents";
    driveExplorerScrollBar.Width = 300;
    driveExplorerScrollBar.Height = 200;
    driveExplorerScrollBar.Load();
    
    document.body.onkeydown = function()
    {
        navigateFolderContents(event);
    }
}
</script>
</head>
<body onmouseenter="flyoutBodyState(true)" onmouseleave="flyoutBodyState(false)" onfocusout="selectItem(selectedItemIndex, false, true)" onload="loadPage()">

<div id="driveExplorerContents"></div>

</body>
</html>
