<script>
		var DotCount = 0;

		function loading() {
			DotCount = DotCount + 1;
			if (DotCount > 5) DotCount = 1;
			var Ellipses = "";
			for(i=0;i<DotCount;i++) {
				Ellipses +=".";
			}
			Msg.innerText = 
			System.Gadget.document.parentWindow.url;	
			Msg.innerText = "Loading" + Ellipses;
		}

</script>
<title>AnyWiki Search Gadget Flyout</title>

</head>

<body onload="setInterval(loading, 250);">
<span id="debug"></span>
<div id="Msg" style="position:absolute;left:0px;top:0px;z-index:2;"></div>
<div id="frame" style="position:absolute;left:0px;top:0px;z-index:1;"></div>

</body>
