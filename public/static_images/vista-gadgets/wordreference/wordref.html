<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; form-action 'none'; base-uri 'self'"><script src="/scripts/comp/sidebar-gadgets/gadgetShim.js"></script>
    <title>WordReference Gadget</title>
    
    <link rel="stylesheet" type="text/css" href="css/styleext.css" />
    <style type="text/css">
    body
    {
        background: #918CE3;    
        width: 130px;        
        height: 58px;
        border: 1px solid #aaaaaa;
        margin: 0px;
        padding: 0px;
        font-family: arial, verdana, sans-serif; 
        font-size: 10px;
    }
    .searchtext
    {        
        margin:0px; 
        padding: 0px;
    }
    </style>

    <script type="text/javascript">
        var languageSetting;
        
	    function body_onload() {
	        LoadSettings();
	    }
	    
        System.Gadget.settingsUI = "settings.html";
        System.Gadget.onSettingsClosed = SettingsClosed;
        function SettingsClosed() {
            LoadSettings();
        }
        
        function LoadSettings() {
            languageSetting = System.Gadget.Settings.read("language");
            if (languageSetting == "") {
                languageSetting = "enfr";
            }
        }
        
        function sbox_submit() {
            var search = document.getElementById("search");
            var url = "http://www.wordreference.com/";
            
            if (languageSetting == "enes") {
                url = url + "es/translation.asp?tranword=" + search.value + "&dict=" + languageSetting;
            } 
            else {
                if (languageSetting == "esen") {
                    url = url + "es/en/translation.asp?spen=" + search.value;
                }
                else {
                    url = url + languageSetting + "/" + search.value
                }
            }
            window.location.href = url;
//            document.sbox.action = url;
//            document.sbox.submit();
            return false;
        }
        
    </script>

</head>
<body onload="body_onload()">
    <!--<div class="searchbox" id="Div1" style="text-align: center; vertical-align: middle; margin: 0px; padding: 0px; ">-->
    <table cellspacing="0" cellpadding="0" width="94%">
        <tr>
            <td class="namecell" align="center">
                <h2>
                    <a href="http://www.wordreference.com/" style="color: #FFFFFF; font-size: 9pt">WordReference.com</a></h2>
            </td>
        </tr>
        <tr>
            <td class="searchbox" height="34px">
                <form method="GET" action="" class="lookup" name="sbox" id="sbox" onsubmit="sbox_submit(); return false;">
                    <table border="0" cellpadding="0" cellspacing="0">
                        <tr valign="middle" height="100%">
                            <td valign="middle" width="100%" height="100%" align="right" class="searchtext">
                                <input type="text" name="search" id="search" size="11" maxlength="200" tabindex="1" /></td>
                            <td align="left" valign="bottom" class="searchtext">
                                <input type="image" src="images/LookUp.gif" alt="Look Up" onclick="sbox_submit(); return false;" />
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
    </table>
    <!--</div>-->
</body>
</html>
