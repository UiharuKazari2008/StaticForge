        <bgSound src="" id="sound">

        <script type="text/javascript">
        
        function cmdCancelar_onclick()
        {
            System.Gadget.document.parentWindow.sound.src = "";
            System.Gadget.document.parentWindow.ErrorIcon_onclick();
            System.Gadget.Flyout.show = false;
        }
        
        </script>

    <body style="height: 145px; width: 340px;">
    
    <div id="alarm" style="position:absolute; border-right: dimgray 1px; 
                            border-top: dimgray 1px; left: 2px; vertical-align: top; 
                            border-left: dimgray 1px; width: 342px; 
                            border-bottom: dimgray 1px; top: 2px; height: 145px; 
                            background-color: transparent; background-position: left top; 
                            background-image: url(images/docked/alarm_back.png);">
        <img src="images\docked\alarm.png" />
        <div style="left: 134px; width: 190px; position: absolute; top: 11px; width: 190px; ">
            <span style="font-family: Verdana"><span style="color: #ffffff"><strong>Alarm</strong><br />
                <br />
                <span style="font-size: 10pt" >Fired: <span id="Tempo">00:00</span></span></span><br />
                <br />
                <input id="cmdCancelar" style="width: 78px; height: 40px" 
                    type="button" value="Cancel" 
                    onclick="cmdCancelar_onclick();"/>
            </span>
        </div>
    </div>
    
    </body>
