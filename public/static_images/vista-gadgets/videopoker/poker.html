////////////////////////////////////////////////////////////////////////////////

//
//
////////////////////////////////////////////////////////////////////////////////
function loadMain()
{
    var validSettings;

    System.Gadget.docked?Dock():unDock();

    resetHand();

    validSettings = parseInt(System.Gadget.Settings.read(setGameValid));
    if (validSettings == 1)
    {
        gameBet = parseInt(System.Gadget.Settings.read(setGameBet));
        gameScore = parseInt(System.Gadget.Settings.read(setGameScore));
        if (gameBet > gameScore)
        {
            gameBet = gameScore;
        }
    }

    instructions.innerHTML = txtPlay;
    betButtons(true);

    showBet();
    showWin("&nbsp;");
    showScore();
}

////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function saveScore()
{
    System.Gadget.Settings.write(setGameBet, gameBet);
    System.Gadget.Settings.write(setGameScore, gameScore);
    System.Gadget.Settings.write(setGameValid, "1");
}

////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function betButtons(visible)
{
    if (visible)
    {
        upButton.style.visibility = "visible";
        downButton.style.visibility = "visible";
        upBetPic.style.visibility = "visible";
        downBetPic.style.visibility = "visible";

        if (gameBet > gameScore)
        {
            gameBet = gameScore;
            showBet();
        }
        fixupBetButtons();
    }
    else
    {
        upButton.style.visibility = "hidden";
        downButton.style.visibility = "hidden";
        upBetPic.style.visibility = "hidden";
        downBetPic.style.visibility = "hidden";
    }
}

////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function fixupBetButtons()
{
    if ((gameBet == 5) || (gameBet == gameScore))
    {
        upButton.className = "aButtonNohover";
    }
    else
    {
        upButton.className = "aButton";
    }

    if (gameBet == 1)
    {
        downButton.className = "aButtonNohover";
    }
    else
    {
        downButton.className = "aButton";
    }
}

////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function betUpButton()
{
    if ((gameBet < 5) && (gameBet < gameScore))
    {
        gameBet += 1;
    }
    showBet();
    fixupBetButtons();

    saveScore();
}

////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function betDownButton()
{
    if (gameBet > 1)
    {
        gameBet -= 1;
    }
    showBet();
    fixupBetButtons();

    saveScore();
}

//

function dealButton()
{
    if (!timergoing)
    {
        if (!started)
        {
            resetHand();
            startHand(true);
        }
        else if (!ended)
        {
            endHand();
        }
        else
        {
            resetHand();
            startHand(false);
        }
    }

    saveScore();
}

////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function resetHand()
{
    var i;

    for (i=0; i < 5; i++)
    {
        cards[i] = -1;        // clear all the cards
        deal[i] = -1;
        cardToSwap[i] = true;    // start by planning to swap all cards

        eval("card" + i).src = "images/cards/cardback.png";
    }

    updateCards();

    divButton.innerHTML = txtDealButton;
    instructions.innerHTML = "";
    outcome.innerHTML = "&nbsp;";
    betButtons(false);

    started = false;        // haven't started game yet
    ended = false;
    timergoing = false;
}

////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function showCards()
{
    var i;
    var loopDone = true;
    var instruct;

    for (i=0; i < 5; i++)
    {
        if (cards[i] == -1)
        {
            cards[i] = deal[i];    // swap in new card
            deal[i] = -1;        // clear from deal set

            eval("card" + i).src = "images\/cards\/" + cards[i] + ".png";

            break;            // only show 1 at a time
        }
    }

    updateCards();

    for (i++; i < 5; i++)    // continue loop
    {
        // more left to swap still???
        if (cards[i] == -1)
        {
            setTimeout("showCards()", timerSpeed);
            loopDone = false;
            break;
        }
    }

    if (loopDone)
    {
        evalHand();

        if (!started)
        {
            divButton.innerHTML = txtDrawButton;
            instructions.innerHTML = txtHold;
            outcome.innerHTML = winners[winHand][0];

            started = true;
        }
        else
        {
            outcome.innerHTML = winners[winHand][0];

            gameScore += winners[winHand][1] * gameBet;
            showScore();

            if (winHand >= 2)
            {
                showWin(winners[winHand][1] * gameBet);
                instruct = txtWinner;
                betButtons(true);
            }
            else if (gameScore > 0)
            {
                showWin("0");
                instruct = txtLoser;
                betButtons(true);
            }
            else
            {
                showWin("0");
                instruct = txtGameOver;
                divButton.style.visibility = "hidden";
                dealBtnPic.style.visibility = "hidden";
                betButtons(false);
            }

            divButton.innerHTML = txtDealButton;
            instructions.innerHTML = instruct;

            ended = true;
        }

        timergoing = false;
    }

    saveScore();
}

////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function dealCards()
{
    var i;
    var card;

    i = 0;
    while (i < 5)
    {
        // pick batch of cards
        card = Math.round((Math.random() * 52) - 0.5);
        if (cardUnique(card))
        {
            deal[i] = card;
            i++;
        }
    }
}

////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function startHand(firstHand)
{
    gameScore -= gameBet;    // it costs this much to play
    showWin("&nbsp;");
    showScore();

    dealCards();

    timergoing = true;

    if (firstHand)
    {
        showCards();    // immediately show first card now (fast UI response)
    }
    else
    {
        setTimeout("showCards()", timerSpeed);
    }
}

////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function endHand()
{
    var i;
    var card;

    dealCards();

    // blank out unheld cards, until timer fills them in
    for (i=0; i < 5; i++)
    {
        if (cardToSwap[i])
        {
            cards[i] = -1;
            eval("card" + i).src = "images/cards/cardback.png";
        }

        cardToSwap[i] = true;    // remove HELD border from all of them now
    }

    updateCards();
    instructions.innerHTML = "";
    outcome.innerHTML = "&nbsp;";

    setTimeout("showCards()", timerSpeed);

    timergoing = true;
}

////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function cardUnique(card)
{
    var unique = true;    // default is TRUE until we find a matching card

    for (i=0; i < 5; i++)
    {
        if ((cards[i] == card) || (deal[i] == card))
        {
            unique = false;    // found a match, so not unique
            break;
        }
    }

    return unique;
}


////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function flipCard(position)
{
    if (started && !ended && !timergoing)
    {
        cardToSwap[position] = !cardToSwap[position];
        updateCards();
    }
}


////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function nameOfCard(card)
{
    var name;

    if (card == -1)
    {
        name = txtCardBack;
    }
    else
    {
        name = cardNames[card];
    }

    return name;
}


////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function updateCards()
{
    var i;

    for (i=0; i < 5; i++)
    {
        if (cardToSwap[i])
        {
            eval("card" + i).style.border = "0px";
            eval("card" + i).style.margin = targetHoldHighlight + "px";

            eval("card" + i).setAttribute('alt', nameOfCard(cards[i]));
        }
        else
        {
            eval("card" + i).style.border = "solid #FF0 " + targetHoldHighlight + "px";
            eval("card" + i).style.margin = "0px";

            eval("card" + i).setAttribute('alt', nameOfCard(cards[i]) + ", HELD");
        }
    }
}


////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function haveThisCard(card)
{
    var i;
    var have = false;
    var checkCard = card;

    if (checkCard == 13)
    {
        checkCard = 0;    // treat High-Ace as low-Ace
    }

    for (i=0; i < 5; i++)
    {
        var value = cards[i] % 13;

        if (checkCard == value)
        {
            have = true;
            break;
        }
    }

    return have;
}

////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function testOfAKinds(cardToIgnore)
{
    var i,j;
    var have = false;
    var count;

    ofAKindCard = -1;

    for (i=12; i >= 0; i--)
    {
        if (i == cardToIgnore)
        {
            continue;
        }

        count = 0;
        for (j=0; j < 5; j++)
        {
            if (i == (cards[j] % 13))
            {
                count++;
            }
        }

        if (count > 1)
        {
            ofAKindCard = i;
            break;
        }
    }

    return count;
}

////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function testFlush()
{
    var i;
    var suit = parseInt(cards[0] / 13);
    var have = true;

    for (i=1; i < 5; i++)
    {
        var nextCardSuit = parseInt(cards[i] / 13);

        if (suit != nextCardSuit)
        {
            have = false;
            break;
        }
    }

    return have;
}

////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function testStraight()
{
    var i,j;
    var have = false;
    var count;

    straightHighCard = -1;

    for (i=13; i >= 4; i--)
    {
        count = 0;

        for (j=0; j <= 4; j++)
        {
            if (!haveThisCard( i - j ))
            {
                break;
            }

            count++;
        }

        if (count == 5)
        {
            have = true;
            straightHighCard = i;
            break;
        }
    }

    return have;
}

////////////////////////////////////////////////////////////////////////////////
//
//
//
////////////////////////////////////////////////////////////////////////////////
function evalHand()
{
    var haveFlush = testFlush();
    var haveStraight = testStraight();
    var iKinds = testOfAKinds(-1);
    var haveFH = false;
    var have2pair = false;
    var have1pair = false;
    var have3kind = false;
    var pairValue;
    winHand = 0;

    if (iKinds == 2)
    {
        have1pair = true;
        pairValue = ofAKindCard;

        iKinds = testOfAKinds(ofAKindCard);

        if (iKinds == 2)
        {
            have2pair = true;
        }
        else if (iKinds == 3)
        {
            haveFH = true;
        }
    }
    else if (iKinds == 3)
    {
        have3kind = true;
        iKinds = testOfAKinds(ofAKindCard);

        if (iKinds == 2)
        {
            haveFH = true;
        }
    }


    if (haveFlush && haveStraight)
    {
        if (straightHighCard == 13)
        {
            // "Royal Flush";
            winHand = 10;
        }
        else
        {
            // "Straight Flush";
            winHand = 9;
        }
    }
    else if (iKinds == 4)
    {
        // "4 of a Kind";
        winHand = 8;
    }
    else if (haveFH)
    {
        // "Full House";
        winHand = 7;
    }
    else if (haveFlush)
    {
        // "Flush";
        winHand = 6;
    }
    else if (haveStraight)
    {
        // "Straight";
        winHand = 5;
    }
    else if (have3kind)
    {
        // "3 of a Kind";
        winHand = 4;
    }
    else if (have2pair)
    {
        // "Two Pair";
        winHand = 3;
    }
    else if (have1pair)
    {
        if ((pairValue == 0) || (pairValue >= 10))
        {
            // "Jacks or better";
            winHand = 2;
        }
        else
        {
            // "Low Pair";
            winHand = 1;
        }
    }
    else
    {
        // "High Card";
        winHand = 0;
    }

}
