<html>
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; form-action 'none'; base-uri 'self'"><script src="/scripts/comp/sidebar-gadgets/gadgetShim.js"></script>

    <title>Ink Notes</title>
    <link href="css/inkNotes.css" type="text/css" rel="stylesheet" />
    <script src="js/inkNotes.js" language="javascript" type="text/javascript"></script>
    <script language="javascript" type="text/javascript" for="noteArea" event="Stroke">
        saveInk();
    </script>
    <script language="javascript" type="text/javascript" for="noteArea" event="CursorInRange(cursor, isNewCursor, buttonState)">
        if (cursor.Inverted)
        {
            noteArea.EditingMode = 1;
        }
        else
        {
		    noteArea.EditingMode = 0;
		}
		setAreaFocus(null, true);
		enableControls(true);
    </script>
    <script language="javascript" type="text/javascript" for="noteArea" event="MouseDown">
		noteArea.EditingMode = 0;
		setAreaFocus(null, true);
		enableControls(true);
    </script>
</head>
<body unselectable="on" scroll="no" onload="loadMain()" onmouseenter="setAreaFocus(null, true);enableControls(true)" onmouseleave="setAreaFocus(null, false);enableControls(false)" onfocusout="setAreaFocus(null, false)">
