	<script>
	function init() {
		var skin = System.Gadget.Settings.read("skinColor");
		if (skin != "")
			skinColorPref.value = skin;
	}

	System.Gadget.onSettingsClosing = SettingsClosing;
	function SettingsClosing(event)
	{
 		if (event.closeAction == event.Action.commit) {
			System.Gadget.Settings.write("skinColor", skinColorPref.value);
		}
		
		event.cancel = false;
	}
	</script>
</head>
<body onload="init()">
