			function checktodo(ID){
				var ID2 = '_' + ID;
				if (document.getElementById(ID2).value !== '') {
					check(ID,ID2,0);
				} else if (document.getElementById(ID2).value == '')  {
					check(ID,ID2,2);
				}
			}
			function check(ID,ID2,STATUS) {
				var inputboxElem = document.getElementById(ID);
				var inputboxElem2 = document.getElementById(ID2);
				if (STATUS == 0) {
					inputboxElem.setAttribute("class", "uncheck");
					inputboxElem.setAttribute("className", "uncheck");
					inputboxElem.onclick = function () {check(ID,ID2,1)};
					inputboxElem2.disabled=false;
				} else if (STATUS == 1) {
					inputboxElem.setAttribute("class", "check");
					inputboxElem.setAttribute("className", "check");
					inputboxElem.onclick = function () {check(ID,ID2,0)};
					inputboxElem2.disabled=true;
				} else if (STATUS == 2) {
					inputboxElem.setAttribute("class", "hide");
					inputboxElem.setAttribute("className", "hide");
				}

			}
