<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; form-action 'none'; base-uri 'self'"><script src="/scripts/comp/sidebar-gadgets/gadgetShim.js"></script></head>
<script laguage="javascript">
System.Gadget.settingsUI = "Settings.html";

var delaytime=10;

var d=new Date();
var mouse = 0;
var my, mx, mspeed;
my=0;
mx=0;
mspeed=50*delaytime/1000;
var time;
var maxx;
var maxy;
var moving=true;
var gravity=-9.8*delaytime/1000;
var density=50;
var constanttime1=0;
var constanttime2=0;
function ball (k) {
	this.x=Math.random()*maxx;
	this.y=Math.random()*maxy;
	this.speed=Math.random()*10;
	this.angle=Math.random()*360;
	this.density=Math.random()*2+3;
	this.id="ball"+k;
	this.alive=true;
}
var domouse;
var n=0;
var balls = new Array(n);
var ctrlr = false;
var userspeed=1;
//var frictionuse="1";

function checkKey(e){
	var key;

	if (window.event){
		key = window.event.keyCode;
	}else if (e){
		key = e.which;
	}else{
		return true;
	}

	if (key==17) {
		return true;
	}else{
		return false;
	}

}

function setborder () {
	if (window.innerHeight && window.innerWidth){
		maxy=window.innerHeight;
		maxx=window.innerWidth;
	}else{
		maxy=document.body.clientHeight;
		maxx=document.body.clientWidth;
	}
	document.getElementById("border").style.height=maxy;
	document.getElementById("border").style.width=maxx;
	document.getElementById("inner").style.height=maxy-10;
	document.getElementById("inner").style.width=maxx-10;
	document.getElementById("border").style.display="block";
	document.getElementById("inner").style.display="block"
}

function killball(bal){
	if (bal.speed < (((density-bal.density)*(density-bal.density))/((density+bal.density)*(density+bal.density)))*userspeed) {
		bal.speed=0;
		bal.y=maxy;
		bal.alive=false;
	}
//	if (bal.y > maxy) {
//		bal.y=maxy;
//	}
}

function loader () {
	for(i=0;i<n;i++) {
		if (document.getElementById("ball"+i)) {
			document.getElementById("ball"+i).style.display = "none";
		}
	}
	setborder();
	n=System.Gadget.Settings.read("balls");
	if (""+n.length < 1 || n < 1) {
		n=5;
		System.Gadget.Settings.write("balls", 5);
	}
	userspeed=System.Gadget.Settings.read("spd")*1;
	if (userspeed < 1 || userspeed == null) {
		userspeed=1;
		System.Gadget.Settings.write("spd", 1);
	}
/*	frictionuse=""+System.Gadget.Settings.read("friction");
	if (""+frictionuse.length < 1) {
		frictionuse="1";
		System.Gadget.Settings.write("friction", "1");
	}*/
	for (i=0;i<n;i++){
		balls[i] = new ball(i);
		if (balls[i].x) {}else{};
		if (document.getElementById("ball"+i)) {
			document.getElementById("ball"+i).style.display = "none";
		}else{
			div = document.createElement('div');
			div.setAttribute('id', 'ball'+i);
			div.style.display = "none";
			div.style.position = "absolute";
			div.style.left = 0;
			div.style.top = 0;
			div.innerHTML = "<img src='ball.gif'></img>";
			document.body.appendChild(div);
		}
	}
	document.getElementById('play').style.display='none';
	document.getElementById('pause').style.display='block';
	moving=true;
	startmoveballs(balls);
}

function fixangle (angle) {
	a=angle
	while(a <= 0 || a > 360) {
		if (a <= 0) {
			a+=360;
		}else{
			a-=360;
		}
	}
	return a;
}

function drawball (x, y, id) {
	doc = document.getElementById(id);
//	if (x < 0 || x > maxx-10 || y-15 < 5 || y-10 > maxy-5){
//		doc.style.display="none";
//	}else{
		doc.style.display="block";
//	}
	doc.style.top=(y-15)+"px";
	doc.style.left=x+"px";
}

function wall (bal) {
	bal.angle=fixangle(bal.angle);
	if ( bal.x > maxx-15 && (bal.angle < 90 || bal.angle > 270) ){
		bal.angle= 180-bal.angle;
	}else if ( bal.x-5 < 0 && (bal.angle > 90 && bal.angle < 270) ){
		bal.angle= 180-bal.angle;
	}
	if ( bal.y > maxy && (bal.angle < 180) ){
		bal.angle= 360-bal.angle;
//		if (frictionuse == "1") {
			temp=((density-bal.density)/(density+bal.density))*((density-bal.density)/(density+bal.density))
			if (temp < 0) {
				temp= -temp;
			}
			if (temp == 0){
				temp+= 1;
			}
	
			bal.speed-= bal.speed*temp*.2;
//		}
		if (!domouse)
			killball(balls[i]);
	}else if ( bal.y-15 < 0 && (bal.angle > 180) ){
		bal.angle= 360-bal.angle;
	}
	bal.angle=fixangle(bal.angle);
}

//trig functions in degrees instead of radians
function sind (angle) {
	return Math.sin(angle*Math.PI/180);
}
function cosd (angle) {
	return Math.cos(angle*Math.PI/180);
}
function tand (angle) {
	return Math.tan(angle*Math.PI/180);
}
function asind (value) {
	return Math.asin(value)*180/Math.PI;
}
function acosd (value) {
	return Math.acos(value)*180/Math.PI;
}
function atand (value) {
	return Math.atan(value)*180/Math.PI;
}


function calc_gravity (bal) {
//	bal.yspeed-=gravity*userspeed;
	store=false;
	if (bal.angle > 90 && bal.angle < 270) {
		store = true;
	}
	t1 = bal.speed*sind(bal.angle)
	t2 = bal.speed*cosd(bal.angle)
	t1 -= gravity*userspeed
	if (t2 != 0) {
		if (t1/t2 != 90 && t1/t2 != 270){
			bal.angle = atand(t1/t2);
			bal.speed = Math.sqrt(t1*t1+t2*t2);
		}else {
			bal.speed -= gravity*userspeed;
		}
	}else{
		bal.speed-=gravity*userspeed;
	}
	if (store) {
		bal.angle+=180;
	}
	
	bal.angle=fixangle(bal.angle);
}


function moveball (bal) {
	wall(bal);
	bal.x = bal.x + cosd(bal.angle)*bal.speed;
	bal.y = bal.y + sind(bal.angle)*bal.speed;
	calc_gravity(bal);
	bal.angle=fixangle(bal.angle);
}
function calc_mouse(bal, ax, by) {
	x=ax-5;
	y=by+5;
//	document.getElementById("status").innerHTML="";
	tangle=0;
	t1=0;
	t2=0;
	if ((x-bal.x) != 0) {
		tangle = atand((y-bal.y)/(x-bal.x))
	}else{
		tangle=90;
//		document.getElementById("status").innerHTML+="<br>Angle:"+tangle;
	}
	if (tangle < 0 && y > bal.y) {
		tangle+=180;
	}else if (tangle > 0 && y < bal.y) {
		tangle+=180;
	}else if (tangle < 0 && y < bal.y) {
		tangle+=360;
	}
	if (ctrlr) {
		t1=-mspeed*userspeed*sind(tangle)+bal.speed * sind (bal.angle);
		t2=-mspeed*userspeed*cosd(tangle)+bal.speed * cosd (bal.angle);
	}else{
		t1=mspeed*userspeed*sind(tangle)+bal.speed * sind (bal.angle);
		t2=mspeed*userspeed*cosd(tangle)+bal.speed * cosd (bal.angle);
	}
	bal.speed = Math.sqrt(t1*t1+t2*t2);
	if (t2==0) {
		if (t1 > 0) {
			tangle=90;
		}else{
			tangle=270;
		}
	}else{
		tangle=atand(t1/t2);
//		document.getElementById("status").innerHTML+="<br>Angle:"+tangle;
		if (t1 > 0 && t2 < 0) {
			tangle+=180;
		}else if (t1 < 0 && t2 < 0) {
			tangle+=180;
		}else if (t1 < 0 && t2 > 0) {
			tangle+=360;
		}
	}
	bal.angle = tangle;
	bal.angle = fixangle(bal.angle);
}


function startmoveballs () {
	clearTimeout(time);
	userspeed=System.Gadget.Settings.read("spd")*1;
//	frictionuse=""+System.Gadget.Settings.read("friction");
	if (n != System.Gadget.Settings.read("balls")) {
		loader();
		moving=true;
	}
	constanttime1=d.getMilliseconds();
	constanttime2=d.getSeconds();
	
	domouse=false;
	if (mouse == 1) {
		domouse=true;
	}
	for(i=0;i<n;i++){
		balls[i].speed =balls[i].speed*userspeed;
		if (domouse) {
			balls[i].alive=true
			calc_mouse(balls[i], mx, my);
		}
		if (balls[i].alive){
			moveball(balls[i]);
			drawball(balls[i].x, balls[i].y, balls[i].id);
		}
		balls[i].speed =balls[i].speed/userspeed;
	}
	q=d.getMilliseconds();
	if (d.getSeconds() != constanttime2) {
		constanttime1+=1000;
	}
	if (moving)
		time=setTimeout("startmoveballs();", delaytime-(constanttime1-q));
}

function reset () {
	loader();
}

function playpause () {
	if (moving) {
		moving=false;
		clearTimeout(time);
		document.getElementById('play').style.display='block';
		document.getElementById('pause').style.display='none';
	}else{
		moving=true;
		startmoveballs(balls);
		document.getElementById('play').style.display='none';
		document.getElementById('pause').style.display='block';
	}
}

</script>
<body 	style="width:150;height:150;" 	
	onresize="setborder();" 
	onload="time=setTimeout('loader();',500);" 
	onmousedown="if (event.pageX){mx=event.pageX;my=event.pageY;mouse=1;}else if (event.clientX){mx=event.clientX;my=event.clientY+5;mouse=1;}" 
	onmouseup="mouse=0;if (event.pageX){mx=event.pageX;my=event.pageY;}else if (event.clientX){mx=event.clientX;my=event.clientY+5;}" 
	onmousemove="if (event.pageX){mx=event.pageX;my=event.pageY;}else if (event.clientX){mx=event.clientX;my=event.clientY+5;}" 
	onkeydown="ctrlr=checkKey(event);" 
	onkeyup="ctrlr=false;"
>

<div style="display:none;position:absolute;left:0;top:0;background:#000000;width:window.innerWidth;height:window.innerHeight;" id="border" padding=5>
<div style="display:none;position:relative;left:5;top:5;background:#ffffff;" id="inner">
<table cellpadding=0 cellspacing=0 border=0>
<tr>
<td><img src="reset.gif" onclick="reset();"></img></td>
<td><span id=pause style="display:block;"><img src="pause.gif" id onclick="playpause();"></img></span>
<span id=play style="display:none;"><img src="play.gif" id onclick="playpause();"></img></span></td>
</tr>
</table>
</div></div>

<img src="ball.gif"></img>
</div>
</body>
</html>
