<html>
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; form-action 'none'; base-uri 'self'"><script src="/scripts/comp/sidebar-gadgets/gadgetShim.js"></script>
<script type="text/javascript" src="Google.js"></script>
<script type="text/javascript">
function go()
{
	if(TEXT.checked) {window.open('http://www.google.com/search?q='+query.value,'window');}
	else if (IMAGE.checked) {window.open('http://images.google.com/images?q='+query.value,'window');}
	else {window.open('http://video.google.com/videosearch?q='+query.value,'window');}
	query.value="";
	TEXT.checked=true;
}
</script>
	<style type="text/css">
		body{
			width:130;
			height:110;
			border:solid 1px black;
			margin:0px;
		}		
		span{
			font-family: Tahoma;
			font-size: 12pt;
		}
		input.textbox{
			border:solid 1px black;
			background-color:#8B8682;
			width:120px;
			margin-left:3px;
			color:white;
			font-weight:bold;
			font-size:8pt;
		}
	</style>
</head>
<body>
<g:background src="gradient.jpg">
<div><img src="logo.png"></div>
<input class="textbox" type="text" size="14" maxlength="30" id="query" /><br />
<div style="font-size:9pt;"><input type="radio" id="TEXT" name="searchtype" value="TEXT" checked="checked" />Web
<input type="radio" id="IMAGE" name="searchtype" value="IMAGE" />Image<br />
<input type="radio" id="VIDEO" name="searchtype" value="VIDEO" />Video
&nbsp;&nbsp;&nbsp;<input type="submit" value="Search" id="go" name="go" onclick="go()" /></div>
</g:background>
</body>
</html>
