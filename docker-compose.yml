services:
  dreamscape:
    build:
      context: .
      dockerfile: Dockerfile
    image: dreamscape:local
    container_name: dreamscape
    ports:
      - "9220:9220"
    environment:
      NEKOAI_JS_SOURCE: registry
    volumes:
      # Host tree stays visible to rsync/pack; app code is baked into the image.
      - ./images:/app/images
      - ./.previews:/app/.previews
      - ./.cache:/app/.cache
      - ./logs:/app/logs
      - ./securePrompts:/app/securePrompts
      # Create missing configs on the host first: bash scripts/setup.sh --mode docker --no-run
      # (Docker creates a directory if a bind-mounted file is missing.)
      - ./config.json:/app/config.json
      - ./secure.config.json:/app/secure.config.json
      - ./prompt.config.json:/app/prompt.config.json
      - ./director.config.json:/app/director.config.json
      - ./characters.json:/app/characters.json
      - ./nax_generation_config.json:/app/nax_generation_config.json
    restart: unless-stopped
    mem_limit: 4g
